<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>釣魚世界 🎣 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep-navy:#0a1826;
  --water-teal:#0e5266;
  --water-teal-2:#12768f;
  --moss:#2f5233;
  --moss-2:#3d6b40;
  --amber:#e8a33d;
  --amber-bright:#ffc766;
  --gold:#ffd76a;
  --panel:#0f2536ee;
  --panel-light:#173650;
  --line:#2a5570;
  --text-main:#eef4f6;
  --text-dim:#9db3c0;
  --perfect:#38e08a;
  --great:#f5d95a;
  --good:#6cb8ff;
  --miss:#ff6262;
  --thunder:#f7e34d;
  --danger:#ff5c5c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  background:var(--deep-navy);
  font-family:'Noto Sans TC', sans-serif;
  color:var(--text-main);
  touch-action:none;
}
.pixel{font-family:'Press Start 2P', monospace;}
#app{position:fixed; inset:0; width:100%; height:100%; overflow:hidden;}
.screen{position:absolute; inset:0; display:none; flex-direction:column;}
.screen.active{display:flex;}
canvas{display:block; image-rendering:pixelated;}

/* ---------- Intro ---------- */
#screen-intro{
  align-items:center; justify-content:center; text-align:center;
  background:
    radial-gradient(ellipse at 50% 20%, #163a52 0%, transparent 60%),
    linear-gradient(180deg, #081420 0%, #051019 60%, #030a10 100%);
  padding:24px;
}
.intro-wave{position:absolute; bottom:0; left:0; width:100%; height:140px; opacity:.5; pointer-events:none;}
.intro-title{
  font-size:15px; line-height:2.1; letter-spacing:1px; color:var(--gold);
  text-shadow:0 0 18px rgba(255,215,106,.5), 0 2px 0 #000;
  margin-bottom:28px;
  animation:fadeIn 1.2s ease;
}
.intro-sub{
  font-size:14px; line-height:2; color:var(--text-dim); max-width:340px; margin-bottom:26px;
  animation:fadeIn 1.6s ease;
  white-space:pre-line;
}
.intro-final{font-size:14px; color:#fff; margin-bottom:34px; animation:fadeIn 2.2s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.btn{
  font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:15px;
  border:none; border-radius:10px; padding:14px 26px; cursor:pointer;
  background:linear-gradient(180deg, var(--amber-bright), var(--amber));
  color:#2b1a02; box-shadow:0 4px 0 #8a5a10, 0 6px 14px rgba(0,0,0,.4);
  transition:transform .08s;
  letter-spacing:1px;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a5a10;}
.btn.secondary{background:linear-gradient(180deg,#3a6b86,#245066); color:#eaf6ff; box-shadow:0 4px 0 #123141, 0 6px 14px rgba(0,0,0,.4);}
.btn.danger{background:linear-gradient(180deg,#ff7d7d,#e14b4b); color:#3a0000; box-shadow:0 4px 0 #8f1414;}
.btn:disabled{opacity:.4; filter:grayscale(.4);}

#name-form{display:flex; flex-direction:column; align-items:center; gap:18px; animation:fadeIn 1.4s ease;}
#name-input{
  font-family:'Noto Sans TC', sans-serif; font-size:16px; padding:12px 16px; border-radius:10px;
  border:2px solid var(--amber); background:#0c2334; color:#fff; text-align:center; width:220px;
}
#name-input:focus{outline:none; box-shadow:0 0 0 3px rgba(232,163,61,.4);}
.name-label{font-size:14px; color:var(--text-dim);}

/* ---------- World / third person ---------- */
#screen-world{background:#000;}
#world-canvas{position:absolute; inset:0; width:100%; height:100%;}
.hud-top{
  position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
  padding:10px 12px; pointer-events:none; z-index:5;
}
.hud-pill{
  background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 12px;
  font-size:12px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(2px);
  box-shadow:0 3px 8px rgba(0,0,0,.35);
}
.hud-pill b{color:var(--gold);}
#codex-btn{pointer-events:auto; cursor:pointer;}

.prompt-fish{
  position:absolute; left:50%; top:32%; transform:translate(-50%,0); z-index:6;
  display:none; flex-direction:column; align-items:center; gap:10px;
  animation:bob 1.6s ease-in-out infinite;
}
.prompt-fish.show{display:flex;}
@keyframes bob{0%,100%{transform:translate(-50%,0);} 50%{transform:translate(-50%,-8px);}}
.prompt-badge{
  background:var(--panel); border:1px solid var(--amber); border-radius:12px; padding:8px 14px;
  font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.5);
}

.joystick-zone{position:absolute; left:0; bottom:0; width:46%; height:52%; z-index:7;}
.joystick-base{
  position:absolute; width:104px; height:104px; border-radius:50%;
  background:rgba(20,50,70,.45); border:2px solid rgba(232,163,61,.5); display:none;
}
.joystick-knob{
  position:absolute; width:46px; height:46px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--amber-bright), var(--amber));
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}
.action-zone{position:absolute; right:14px; bottom:20px; z-index:7; display:flex; flex-direction:column; gap:12px; align-items:flex-end;}
.round-btn{
  width:74px; height:74px; border-radius:50%; border:none;
  background:radial-gradient(circle at 35% 30%, var(--amber-bright), var(--amber));
  color:#2b1a02; font-weight:700; font-size:12px; box-shadow:0 5px 0 #8a5a10, 0 7px 16px rgba(0,0,0,.4);
  display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2;
}
.round-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #8a5a10;}
.round-btn.small{width:58px; height:58px; font-size:22px;}

/* ---------- Fishing first person ---------- */
#screen-fishing{background:#01141f;}
#fish-canvas{position:absolute; inset:0; width:100%; height:100%;}
.fp-hands{position:absolute; left:0; right:0; bottom:0; height:46%; pointer-events:none; z-index:4;}
.fishing-hud-tl{position:absolute; top:12px; left:12px; z-index:6;}
.fishing-hud-tr{position:absolute; top:12px; right:12px; z-index:6; text-align:right; display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
.fishing-hud-bl{position:absolute; bottom:16px; left:12px; z-index:6;}
.fishing-hud-br{position:absolute; bottom:16px; right:14px; z-index:6;}
.bite-mark{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0);
  font-size:64px; color:var(--danger); text-shadow:0 0 20px rgba(255,0,0,.7); z-index:8;
  font-family:'Press Start 2P';
}
.bite-mark.show{animation:pop .5s ease forwards;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0); opacity:0;} 40%{transform:translate(-50%,-50%) scale(1.3); opacity:1;} 100%{transform:translate(-50%,-50%) scale(1); opacity:1;}}
.hint-text{
  position:absolute; left:50%; bottom:34%; transform:translate(-50%,0); z-index:6;
  font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 14px;
  display:none;
}
.hint-text.show{display:block; animation:fadeIn .3s ease;}

/* ---------- Calibration ---------- */
#calib-overlay{
  position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column;
  background:rgba(2,10,16,.55);
}
#calib-overlay.show{display:flex;}
.calib-title{font-size:13px; color:var(--gold); margin-bottom:18px; letter-spacing:1px;}
.calib-track{
  position:relative; width:88%; max-width:420px; height:34px; border-radius:17px;
  background:#0c2233; border:2px solid var(--line); overflow:hidden; box-shadow:inset 0 3px 8px rgba(0,0,0,.5);
}
.calib-zone{position:absolute; top:0; bottom:0; background:rgba(56,224,138,.35); border-left:2px solid var(--perfect); border-right:2px solid var(--perfect);}
.calib-zone-inner{position:absolute; top:0; bottom:0; background:rgba(56,224,138,.75);}
.calib-indicator{
  position:absolute; top:-6px; width:8px; height:46px; border-radius:4px;
  background:linear-gradient(180deg,#fff,#ffd76a); box-shadow:0 0 10px rgba(255,215,106,.8);
}
.calib-result{
  margin-top:20px; font-size:22px; font-family:'Press Start 2P'; opacity:0; transform:scale(.6);
}
.calib-result.show{animation:resultPop .6s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes resultPop{to{opacity:1; transform:scale(1);}}
.calib-buffs{margin-top:10px; font-size:12px; color:var(--text-dim); text-align:center; min-height:18px;}
#calib-tap{margin-top:26px;}

/* ---------- Battle ---------- */
#screen-battle{background:linear-gradient(180deg,#03141f,#02090f);}
.battle-top{padding:12px 14px 0; display:flex; justify-content:space-between; align-items:flex-start;}
.fish-card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; min-width:150px;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
}
.fish-name{font-size:14px; font-weight:700; color:var(--gold); display:flex; align-items:center; gap:6px;}
.bar-wrap{margin-top:6px;}
.bar-label{font-size:10px; color:var(--text-dim); display:flex; justify-content:space-between;}
.bar-bg{height:10px; border-radius:6px; background:#0c2233; overflow:hidden; margin-top:2px; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:6px; transition:width .35s ease;}
.bar-fill.capture{background:linear-gradient(90deg,#ff8a5c,#ff5c5c);}
.bar-fill.struggle{background:linear-gradient(90deg,#ffd76a,#e8a33d);}
.fish-weak{font-size:11px; margin-top:6px; color:var(--thunder);}
.fish-sprite{width:64px; height:64px; margin:0 auto;}

.player-status{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; text-align:right;}
.energy-row{display:flex; gap:5px; justify-content:flex-end; margin-top:4px;}
.energy-dot{width:14px; height:14px; border-radius:4px; background:#1a3a4d; border:1px solid var(--line);}
.energy-dot.on{background:var(--amber-bright); box-shadow:0 0 6px rgba(255,199,102,.8);}
.buff-tags{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; margin-top:6px;}
.buff-tag{font-size:10px; padding:2px 6px; border-radius:8px; background:rgba(56,224,138,.18); color:var(--perfect); border:1px solid rgba(56,224,138,.4);}

.battle-log{
  margin:8px 14px 0; font-size:11px; color:var(--text-dim); min-height:16px; text-align:center;
}
.battle-mid{flex:1; position:relative; display:flex; align-items:center; justify-content:center;}
#battle-fx-canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}

.hand-wrap{padding:10px 10px 14px; display:flex; flex-direction:column; gap:10px;}
.hand-row{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none;}
.hand-row::-webkit-scrollbar{display:none;}
.card{
  min-width:104px; max-width:104px; height:140px; border-radius:12px; padding:8px;
  display:flex; flex-direction:column; justify-content:space-between; flex-shrink:0;
  border:2px solid var(--line); box-shadow:0 4px 10px rgba(0,0,0,.4); transition:transform .12s, box-shadow .12s;
  background:linear-gradient(160deg, #16324a, #0d2131);
}
.card.attack{border-color:#e05c5c;}
.card.defense{border-color:#4fa0e0;}
.card.skill{border-color:#c76ce0;}
.card.support{border-color:#6ee08d;}
.card.selected{transform:translateY(-10px); box-shadow:0 0 14px rgba(255,215,106,.7);}
.card.disabled{opacity:.35;}
.card-type{font-size:9px; color:var(--text-dim); display:flex; justify-content:space-between;}
.card-icon{font-size:22px; text-align:center;}
.card-name{font-size:11px; font-weight:700; text-align:center; line-height:1.3;}
.card-desc{font-size:9px; color:var(--text-dim); text-align:center; line-height:1.25;}
.battle-actions{display:flex; gap:10px; justify-content:center;}

/* ---------- Result / codex ---------- */
#screen-result{align-items:center; justify-content:center; background:radial-gradient(circle at 50% 30%, #163a52, #030a10 70%);}
.result-card{
  background:var(--panel); border:2px solid var(--amber); border-radius:18px; padding:28px 26px; text-align:center;
  width:86%; max-width:340px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:resultPop .5s cubic-bezier(.2,1.4,.4,1);
}
.result-title{font-size:13px; color:var(--gold); margin-bottom:10px; letter-spacing:1px;}
.result-fish{font-size:20px; font-weight:900; margin:10px 0 4px;}
.result-stars{color:var(--thunder); font-size:15px; margin-bottom:14px;}
.result-stats{font-size:12px; color:var(--text-dim); line-height:1.9; text-align:left; padding:0 8px;}
.result-stats b{color:#fff;}

#screen-codex{background:var(--deep-navy); align-items:stretch;}
.codex-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line);}
.codex-list{flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.codex-item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
.codex-item .name{font-size:12px; font-weight:700; margin-top:4px;}
.codex-item .meta{font-size:10px; color:var(--text-dim); margin-top:4px;}
.codex-item.locked{opacity:.35;}

/* toast */
#toast{
  position:absolute; left:50%; top:14%; transform:translate(-50%,-20px); z-index:50;
  background:var(--panel); border:1px solid var(--amber); border-radius:10px; padding:10px 18px;
  font-size:12px; opacity:0; transition:all .3s ease; pointer-events:none;
}
#toast.show{opacity:1; transform:translate(-50%,0);}

/* screen shake */
.shake{animation:shakeAnim .4s ease;}
@keyframes shakeAnim{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-6px,3px);}
  40%{transform:translate(6px,-4px);}
  60%{transform:translate(-5px,-2px);}
  80%{transform:translate(4px,3px);}
}
::selection{background:transparent;}
</style>
</head>
<body>
<div id="app">

  <!-- 開場 -->
  <div class="screen active" id="screen-intro">
    <canvas id="intro-canvas" class="intro-wave"></canvas>
    <div id="intro-step-1">
      <div class="intro-title pixel">🎣 歡迎來到<br>釣魚世界 🌍</div>
      <button class="btn" onclick="Game.introNext()">開始</button>
    </div>
    <div id="intro-step-2" style="display:none;">
      <div class="intro-sub">一片未知的海洋
無數等待被發現的魚類
還有傳說中從未有人捕獲過的神秘生物……</div>
      <div class="intro-final">你的故事，將從這裡開始。</div>
      <button class="btn" onclick="Game.introNext()">繼續</button>
    </div>
    <div id="intro-step-3" style="display:none;">
      <div class="name-label" style="margin-bottom:14px;">請問你的名字是？</div>
      <div id="name-form">
        <input id="name-input" maxlength="8" placeholder="輸入角色名稱">
        <button class="btn" onclick="Game.confirmName()">確認並開始冒險</button>
      </div>
    </div>
  </div>

  <!-- 第三人稱世界 -->
  <div class="screen" id="screen-world">
    <canvas id="world-canvas"></canvas>
    <div class="hud-top">
      <div class="hud-pill" id="codex-btn" onclick="Game.openCodex()">📖 圖鑑 <b id="hud-codex-count">0/2</b></div>
      <div class="hud-pill">🧑 <b id="hud-player-name">?</b> · Lv.<b id="hud-level">1</b></div>
    </div>
    <div class="prompt-fish" id="fish-prompt">
      <div class="prompt-badge">🎣 可以在這裡釣魚</div>
      <button class="btn" onclick="Game.startFishing()">開始釣魚</button>
    </div>
    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base" id="joystick-base"><div class="joystick-knob" id="joystick-knob"></div></div>
    </div>
    <div class="action-zone">
      <button class="round-btn small" id="btn-interact" style="display:none;" onclick="Game.startFishing()">互動</button>
    </div>
  </div>

  <!-- 第一人稱釣魚 -->
  <div class="screen" id="screen-fishing">
    <canvas id="fish-canvas"></canvas>
    <canvas id="fp-hands-canvas" class="fp-hands"></canvas>

    <div class="fishing-hud-tl">
      <div class="hud-pill">🌲 迷霧森林湖泊</div>
    </div>
    <div class="fishing-hud-tr">
      <div class="hud-pill" id="hud-time">14:32</div>
      <div class="hud-pill" id="hud-weather">☀ 晴天</div>
    </div>
    <div class="fishing-hud-bl">
      <div class="hud-pill">🎣 初級釣竿 Lv.1</div>
    </div>
    <div class="fishing-hud-br">
      <button class="btn danger" onclick="Game.endFishing()">結束釣魚</button>
    </div>

    <div class="bite-mark" id="bite-mark">！</div>
    <div class="hint-text" id="hint-text">快點！在魚跑掉之前拉竿！</div>

    <div class="action-zone" id="fishing-action-zone">
      <button class="round-btn" id="btn-cast" onclick="Game.castLine()">拋竿</button>
    </div>
  </div>

  <!-- 校準 -->
  <div id="calib-overlay">
    <div class="calib-title pixel">🎯 釣魚校準</div>
    <div class="calib-track" id="calib-track">
      <div class="calib-zone" id="calib-zone"><div class="calib-zone-inner" id="calib-zone-inner"></div></div>
      <div class="calib-indicator" id="calib-indicator"></div>
    </div>
    <div class="calib-buffs" id="calib-buffs-preview"></div>
    <button class="round-btn" id="calib-tap" onclick="Calibration.tap()">校準</button>
    <div class="calib-result pixel" id="calib-result"></div>
  </div>

  <!-- 卡牌戰鬥 -->
  <div class="screen" id="screen-battle">
    <div class="battle-top">
      <div class="fish-card">
        <div class="fish-name" id="battle-fish-name">🐟 ???</div>
        <div class="fish-weak" id="battle-fish-weak"></div>
        <div class="bar-wrap">
          <div class="bar-label"><span>捕獲值</span><span id="battle-capture-num">100/100</span></div>
          <div class="bar-bg"><div class="bar-fill capture" id="battle-capture-bar" style="width:100%"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label"><span>魚反抗力</span><span id="battle-struggle-num">10</span></div>
          <div class="bar-bg"><div class="bar-fill struggle" id="battle-struggle-bar" style="width:20%"></div></div>
        </div>
      </div>
      <div class="player-status">
        <div style="font-size:12px; color:var(--text-dim);">回合 <b id="battle-turn" style="color:#fff;">1</b>/<span id="battle-turn-max">6</span></div>
        <div class="energy-row" id="battle-energy"></div>
        <div class="buff-tags" id="battle-buffs"></div>
      </div>
    </div>
    <div class="battle-log" id="battle-log">校準完成，戰鬥開始！</div>
    <div class="battle-mid">
      <canvas id="battle-fx-canvas"></canvas>
      <div class="fish-sprite" id="battle-fish-sprite" style="font-size:56px; text-align:center;">🐟</div>
    </div>
    <div class="hand-wrap">
      <div class="hand-row" id="hand-row"></div>
      <div class="battle-actions">
        <button class="btn secondary" onclick="Battle.endTurn()">結束回合</button>
      </div>
    </div>
  </div>

  <!-- 捕獲結果 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-title pixel">🎣 捕獲成功！</div>
      <div id="result-fish-emoji" style="font-size:52px;">🐟</div>
      <div class="result-fish" id="result-fish-name">???</div>
      <div class="result-stars" id="result-fish-rarity">★★★</div>
      <div class="result-stats" id="result-stats"></div>
      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
        <button class="btn secondary" onclick="Game.openCodex(true)">查看圖鑑</button>
        <button class="btn" onclick="Game.backToFishingFromResult()">繼續釣魚</button>
      </div>
    </div>
  </div>

  <!-- 圖鑑 -->
  <div class="screen" id="screen-codex">
    <div class="codex-header">
      <div class="pixel" style="font-size:13px; color:var(--gold);">📖 魚類圖鑑</div>
      <button class="btn secondary" id="codex-close-btn" onclick="Game.closeCodex()">關閉</button>
    </div>
    <div class="codex-list" id="codex-list"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* =========================================================
   音效系統 (Web Audio 合成，離線可用)
========================================================= */
const Sound = (() => {
  let ctx = null;
  function ac(){ if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); } return ctx; }
  function tone(freq, dur, type='sine', vol=0.2, delay=0, glideTo=null){
    const c = ac();
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }
  function noise(dur, vol=0.15, delay=0, filterFreq=1200){
    const c = ac();
    const t0 = c.currentTime + delay;
    const bufferSize = c.sampleRate * dur;
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const src = c.createBufferSource(); src.buffer = buffer;
    const filt = c.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = filterFreq;
    const gain = c.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(filt); filt.connect(gain); gain.connect(c.destination);
    src.start(t0);
  }
  return {
    click(){ try{ tone(520,0.06,'square',0.12); }catch(e){} },
    cast(){ try{ tone(300,0.35,'sine',0.15,0,700); noise(0.4,0.08,0.05,2000); }catch(e){} },
    splash(){ try{ noise(0.5,0.25,0,1600); tone(180,0.3,'sine',0.1,0.02);}catch(e){} },
    ripple(){ try{ noise(0.15,0.03,0,3000);}catch(e){} },
    bite(){ try{ tone(880,0.12,'square',0.2); tone(660,0.15,'square',0.2,0.08);}catch(e){} },
    calibTick(){ try{ tone(700,0.04,'square',0.1);}catch(e){} },
    perfect(){ try{ [660,880,1100,1320].forEach((f,i)=>tone(f,0.18,'triangle',0.18,i*0.07)); }catch(e){} },
    great(){ try{ [660,880,990].forEach((f,i)=>tone(f,0.16,'triangle',0.16,i*0.07)); }catch(e){} },
    good(){ try{ tone(520,0.14,'triangle',0.15); tone(660,0.14,'triangle',0.14,0.08);}catch(e){} },
    miss(){ try{ tone(220,0.25,'sawtooth',0.16,0,140);}catch(e){} },
    cardAttack(){ try{ tone(180,0.12,'sawtooth',0.2); noise(0.2,0.12,0,900);}catch(e){} },
    cardDefense(){ try{ tone(400,0.14,'sine',0.15); tone(500,0.14,'sine',0.12,0.05);}catch(e){} },
    cardSkill(){ try{ tone(900,0.1,'sine',0.14); tone(1200,0.1,'sine',0.12,0.06);}catch(e){} },
    cardSupport(){ try{ [700,900,1100].forEach((f,i)=>tone(f,0.1,'sine',0.12,i*0.05)); }catch(e){} },
    victory(){ try{ [523,659,784,1047].forEach((f,i)=>tone(f,0.22,'triangle',0.2,i*0.12)); }catch(e){} },
    fail(){ try{ tone(300,0.3,'sawtooth',0.15,0,100); }catch(e){} },
    open(){ try{ tone(500,0.08,'sine',0.12); tone(700,0.08,'sine',0.1,0.05);}catch(e){} },
  };
})();

const World = {
  canvas:null, ctx:null, raf:null,
  player:{x:400, y:520, vx:0, vy:0, speed:2.4, dir:'down', anim:0},
  lake:{x:420, y:200, rw:230, rh:130},
  camera:{x:0,y:0},
  worldSize:{w:900,h:700},
  nearLake:false,
  joystick:{active:false, dx:0, dy:0, id:null},
  decorations:[],
  running:false,

  init(){
    this.canvas = document.getElementById('world-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    addEventListener('resize', ()=>this.resize());
    if(this.decorations.length===0) this.genDecor();
    this.bindJoystick();
    this.bindInteract();
    this.running = true;
    this.loop();
  },
  resume(){
    this.running = true;
    if(!this._looping) this.loop();
  },
  genDecor(){
    for(let i=0;i<26;i++){
      let x,y;
      do{
        x = rand(20, this.worldSize.w-20);
        y = rand(20, this.worldSize.h-20);
      } while(this.inLake(x,y,40));
      this.decorations.push({x,y,type: Math.random()<0.6?'tree':'rock', s: rand(0.8,1.3)});
    }
  },
  inLake(x,y,pad=0){
    const l = this.lake;
    return x > l.x-pad && x < l.x+l.rw+pad && y > l.y-pad && y < l.y+l.rh+pad;
  },
  resize(){
    this.canvas.width = innerWidth;
    this.canvas.height = innerHeight;
  },
  bindJoystick(){
    const zone = document.getElementById('joystick-zone');
    const base = document.getElementById('joystick-base');
    const knob = document.getElementById('joystick-knob');
    const start = (x,y,id)=>{
      this.joystick.active = true; this.joystick.id = id;
      base.style.display='block';
      base.style.left = (x-52)+'px'; base.style.top = (y-52)+'px';
      knob.style.left = '29px'; knob.style.top='29px';
      this.joystick.baseX = x; this.joystick.baseY = y;
    };
    const move = (x,y)=>{
      if(!this.joystick.active) return;
      let dx = x-this.joystick.baseX, dy = y-this.joystick.baseY;
      const dist = Math.hypot(dx,dy), max=52;
      if(dist>max){ dx = dx/dist*max; dy = dy/dist*max; }
      knob.style.left = (29+dx)+'px'; knob.style.top=(29+dy)+'px';
      this.joystick.dx = dx/max; this.joystick.dy = dy/max;
    };
    const end = ()=>{
      this.joystick.active=false; this.joystick.dx=0; this.joystick.dy=0;
      base.style.display='none';
    };
    zone.addEventListener('touchstart', e=>{
      const t = e.changedTouches[0];
      start(t.clientX, t.clientY, t.identifier);
      e.preventDefault();
    }, {passive:false});
    zone.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){ if(t.identifier===this.joystick.id) move(t.clientX,t.clientY); }
      e.preventDefault();
    }, {passive:false});
    zone.addEventListener('touchend', e=>{ end(); }, {passive:false});
    zone.addEventListener('touchcancel', ()=>end());
    // mouse fallback (desktop)
    zone.addEventListener('mousedown', e=>{ start(e.clientX,e.clientY,'m'); });
    addEventListener('mousemove', e=>{ if(this.joystick.id==='m') move(e.clientX,e.clientY); });
    addEventListener('mouseup', ()=>{ if(this.joystick.id==='m') end(); });

    this._keys = {};
    addEventListener('keydown', e=>{ this._keys[e.key.toLowerCase()]=true; });
    addEventListener('keyup', e=>{ this._keys[e.key.toLowerCase()]=false; });
  },
  bindInteract(){
    document.getElementById('btn-interact').addEventListener('click', ()=>{
      if(this.nearLake) Game.startFishing();
    });
  },
  update(){
    let dx=0, dy=0;
    if(this.joystick.active){ dx=this.joystick.dx; dy=this.joystick.dy; }
    if(this._keys){
      if(this._keys['w']||this._keys['arrowup']) dy=-1;
      if(this._keys['s']||this._keys['arrowdown']) dy=1;
      if(this._keys['a']||this._keys['arrowleft']) dx=-1;
      if(this._keys['d']||this._keys['arrowright']) dx=1;
    }
    const mag = Math.hypot(dx,dy);
    if(mag>0.15){
      dx/=Math.max(mag,1); dy/=Math.max(mag,1);
      const p = this.player;
      p.x = clamp(p.x + dx*p.speed*4, 16, this.worldSize.w-16);
      p.y = clamp(p.y + dy*p.speed*4, 16, this.worldSize.h-16);
      p.anim += 0.25;
      if(Math.abs(dx)>Math.abs(dy)) p.dir = dx>0?'right':'left';
      else p.dir = dy>0?'down':'up';
    }
    const p=this.player;
    const dLake = this.distToLake(p.x,p.y);
    const wasNear = this.nearLake;
    this.nearLake = dLake < 55;
    if(this.nearLake !== wasNear){
      document.getElementById('fish-prompt').classList.toggle('show', this.nearLake);
      document.getElementById('btn-interact').style.display = this.nearLake ? 'flex' : 'none';
    }
    this.camera.x = clamp(p.x - this.canvas.width/2, 0, Math.max(0,this.worldSize.w-this.canvas.width));
    this.camera.y = clamp(p.y - this.canvas.height/2, 0, Math.max(0,this.worldSize.h-this.canvas.height));
  },
  distToLake(x,y){
    const l=this.lake;
    const cx = clamp(x, l.x, l.x+l.rw), cy = clamp(y,l.y,l.y+l.rh);
    return Math.hypot(x-cx,y-cy);
  },
  draw(){
    const ctx=this.ctx, cv=this.canvas, cam=this.camera;
    ctx.save();
    ctx.fillStyle = '#2f5233';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.translate(-cam.x,-cam.y);

    // ground texture (grid dots)
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    for(let x=0;x<this.worldSize.w;x+=32){
      for(let y=0;y<this.worldSize.h;y+=32){
        if((x/32+y/32)%2===0) ctx.fillRect(x,y,32,32);
      }
    }
    // path near lake
    ctx.fillStyle='rgba(180,150,90,0.25)';
    ctx.beginPath();
    ctx.ellipse(this.player.x<500?520:520, 460, 90, 220, 0,0,Math.PI*2);
    ctx.fill();

    // lake
    const l=this.lake;
    const t = performance.now()/600;
    ctx.fillStyle = '#0e5266';
    roundRect(ctx, l.x, l.y, l.rw, l.rh, 40); ctx.fill();
    ctx.strokeStyle='#134a5c'; ctx.lineWidth=6;
    roundRect(ctx, l.x, l.y, l.rw, l.rh, 40); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      for(let x=l.x+10;x<l.x+l.rw-10;x+=8){
        const y = l.y+30+i*30 + Math.sin(x*0.05+t+i)*4;
        if(x===l.x+10) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    if(this.nearLake){
      ctx.strokeStyle='rgba(255,215,106,0.9)'; ctx.lineWidth=3;
      roundRect(ctx, l.x-4, l.y-4, l.rw+8, l.rh+8, 42); ctx.stroke();
    }

    // decorations
    for(const d of this.decorations){
      if(d.type==='tree') drawTree(ctx,d.x,d.y,d.s);
      else drawRock(ctx,d.x,d.y,d.s);
    }

    // player
    drawPlayer(ctx, this.player);

    ctx.restore();
  },
  loop(){
    this._looping = true;
    if(!this.running){ this._looping=false; return; }
    this.update();
    this.draw();
    this.raf = requestAnimationFrame(()=>this.loop());
  }
};

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawTree(ctx,x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,10,14,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#5b3a22'; ctx.fillRect(-4,-6,8,16);
  ctx.fillStyle='#3d6b40'; ctx.beginPath(); ctx.arc(0,-18,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4d8350'; ctx.beginPath(); ctx.arc(-6,-22,11,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawRock(ctx,x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(0,6,12,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7a7a72'; ctx.beginPath(); ctx.ellipse(0,0,10,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8f8f86'; ctx.beginPath(); ctx.ellipse(-2,-2,5,3,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawPlayer(ctx,p){
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,14,10,4,0,0,Math.PI*2); ctx.fill();
  const bob = Math.sin(p.anim)*2;
  ctx.translate(0,bob);
  // legs
  ctx.fillStyle='#2c3e50';
  ctx.fillRect(-6,2,5,10); ctx.fillRect(1,2,5,10);
  // body
  ctx.fillStyle='#e8a33d';
  roundRect(ctx,-8,-14,16,18,4); ctx.fill();
  // head
  ctx.fillStyle='#ffd9b3';
  ctx.beginPath(); ctx.arc(0,-20,8,0,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle='#3a2a1a';
  ctx.beginPath(); ctx.arc(0,-24,8,Math.PI,0); ctx.fill();
  // direction indicator (little face dot)
  ctx.fillStyle='#2b1a02';
  let fx=0, fy=-20;
  if(p.dir==='left') fx=-3; if(p.dir==='right') fx=3; if(p.dir==='down') fy=-18;
  ctx.beginPath(); ctx.arc(fx,fy,1.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

    document.getElementById('btn-cast').style.display='flex';
    document.getElementById('btn-cast').textContent='拋竿';
    document.getElementById('btn-cast').onclick = ()=>Game.castLine();
    document.getElementById('bite-mark').classList.remove('show');
    document.getElementById('hint-text').classList.remove('show');
    this.bobber = {x:0.5,y:0.42, sink:0, visible:false};
  },
  teardown(){
    cancelAnimationFrame(this.raf);
    clearInterval(this._clockInterval);
    clearTimeout(this.waitTimeout); clearTimeout(this.hookWindowTimeout);
    removeEventListener('resize', this._resizeHandler);
  },
  cast(){
    if(this.state!=='idle') return;
    Sound.cast();
    this.state='casting';
    const btn = document.getElementById('btn-cast');
    btn.style.display='none';
    this.bobber.visible = true;
    this.bobber.castAnim = 0;
    setTimeout(()=>{
      Sound.splash();
      this.spawnRipple(true);
      this.state='waiting';
      this.startWaitForBite();
    }, 650);
  },
  startWaitForBite(){
    const delay = rand(2200, 4800);
    this.waitTimeout = setTimeout(()=>{
      if(this.state!=='waiting') return;
      this.triggerBite();
    }, delay);
  },
  spawnRipple(big){
    this.ripples.push({x:this.bobber.x, y:this.bobber.y, r:big?4:2, max: big?70:34, alpha:1});
    if(!big) Sound.ripple();
  },
  triggerBite(){
    this.state='bite';
    this.currentFish = FISH_DB[Math.random()<0.35 ? 'thunderbass':'carp'];
    Sound.bite();
    screenShake();
    const mark = document.getElementById('bite-mark');
    mark.classList.remove('show'); void mark.offsetWidth; mark.classList.add('show');
    document.getElementById('hint-text').classList.add('show');
    this.bobber.sink = 1;
    const btn = document.getElementById('btn-cast');
    btn.style.display='flex';
    btn.textContent='拉竿！';
    btn.onclick = ()=>Fishing.hookFish();
    this.hookWindowTimeout = setTimeout(()=>{
      if(this.state==='bite'){
        toast('魚跑掉了...');
        Sound.fail();
        this.reset();
      }
    }, 1800);
  },
  hookFish(){
    if(this.state!=='bite') return;
    clearTimeout(this.hookWindowTimeout);
    this.state='hooked';
    document.getElementById('hint-text').classList.remove('show');
    document.getElementById('btn-cast').style.display='none';
    Calibration.start(this.currentFish);
  },
  drawWater(){
    const ctx=this.ctx, cv=this.canvas, t=performance.now()/700;
    const grad = ctx.createLinearGradient(0,0,0,cv.height);
    grad.addColorStop(0, '#1a4d63');
    grad.addColorStop(0.35, '#12768f');
    grad.addColorStop(1, '#063445');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,cv.width,cv.height*0.62);
    // sky
    const skyH = cv.height*0.34;
    const sgrad = ctx.createLinearGradient(0,0,0,skyH);
    sgrad.addColorStop(0,'#0a2233'); sgrad.addColorStop(1,'#12405a');
    ctx.fillStyle = sgrad;
    ctx.fillRect(0,0,cv.width,skyH);
    // waterline waves
    ctx.strokeStyle='rgba(255,255,255,0.10)';
    for(let i=0;i<5;i++){
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let x=0;x<=cv.width;x+=14){
        const y = skyH + 20 + i*26 + Math.sin(x*0.02 + t + i)*6;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // ripples
    for(let i=this.ripples.length-1;i>=0;i--){
      const r = this.ripples[i];
      r.r += 1.2; r.alpha -= 0.02;
      if(r.alpha<=0 || r.r>r.max){ this.ripples.splice(i,1); continue; }
      ctx.strokeStyle = `rgba(255,255,255,${r.alpha*0.5})`;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.ellipse(r.x*cv.width, skyH + r.y*(cv.height*0.62-skyH), r.r, r.r*0.35, 0,0,Math.PI*2);
      ctx.stroke();
    }
    if(Math.random()<0.02 && this.state==='waiting') this.spawnRipple(false);

    // bobber
    if(this.bobber.visible){
      let bx = this.bobber.x*cv.width;
      let by = skyH + this.bobber.y*(cv.height*0.62-skyH);
      by += Math.sin(t*2)*3;
      if(this.state==='bite'||this.state==='hooked') by += 10;
      ctx.save();
      ctx.translate(bx,by);
      ctx.fillStyle='#ff5c5c';
      ctx.beginPath(); ctx.arc(0,-4,6,Math.PI,0); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,-4,6,0,Math.PI); ctx.fill();
      ctx.restore();
    }
  },
  drawHands(){
    const ctx=this.handsCtx, cv=this.handsCanvas;
    ctx.clearRect(0,0,cv.width,cv.height);
    const w=cv.width,h=cv.height;
    const sway = Math.sin(performance.now()/900)* (this.state==='waiting'?2:0);
    // rod
    ctx.save();
    ctx.translate(w*0.62, h*0.15+sway);
    ctx.rotate(-0.55);
    const rodGrad = ctx.createLinearGradient(0,0,260,0);
    rodGrad.addColorStop(0,'#8a5a2c'); rodGrad.addColorStop(1,'#3d2412');
    ctx.strokeStyle = rodGrad; ctx.lineWidth=10; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(260,-10); ctx.stroke();
    ctx.restore();
    // line
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(w*0.62+230*Math.cos(-0.55), h*0.15+sway-10-230*Math.sin(-0.55)*-1);
    const tipX = w*0.62 + 255*Math.cos(-0.55);
    const tipY = h*0.15+sway + 255*Math.sin(-0.55);
    ctx.moveTo(tipX,tipY);
    ctx.lineTo(w*0.5, h*0.02);
    ctx.stroke();
    // hands
    ctx.fillStyle = '#e0ad82';
    roundRect2(ctx, w*0.5, h*0.62, 90, 60, 24); ctx.fill();
    roundRect2(ctx, w*0.66, h*0.72, 80, 54, 24); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.08)';
    roundRect2(ctx, w*0.5, h*0.62, 90, 60, 24); ctx.fill();
  },
  loop(){
    this.drawWater();
    this.drawHands();
    this.raf = requestAnimationFrame(()=>this.loop());
  }
};
function roundRect2(ctx,cx,cy,w,h,r){ roundRect(ctx, cx-w/2, cy-h/2, w, h, r); }
Game.castLine = function(){ Fishing.cast(); };

/* =========================================================
   釣魚校準系統
========================================================= */
const Calibration = {
  fish:null,
  pos:0, dir:1, speed:0,
  zoneStart:0, zoneWidth:0,
  running:false,
  raf:null,

  start(fish){
    this.fish = fish;
    document.getElementById('calib-overlay').classList.add('show');
    document.getElementById('calib-result').className='calib-result pixel';
    document.getElementById('calib-result').textContent='';
    document.getElementById('calib-buffs-preview').textContent='';
    document.getElementById('calib-tap').disabled=false;
    document.getElementById('calib-tap').style.display='flex';

    const difficulty = fish.rarity; // 2 or 4
    this.speed = difficulty>=4 ? 0.021 : 0.014;
    this.zoneWidth = difficulty>=4 ? 0.14 : 0.24;
    this.zoneStart = rand(0.15, 1-this.zoneWidth-0.15);
    const track = document.getElementById('calib-track');
    const zoneEl = document.getElementById('calib-zone');
    const zoneInner = document.getElementById('calib-zone-inner');
    zoneEl.style.left = (this.zoneStart*100)+'%';
    zoneEl.style.width = (this.zoneWidth*100)+'%';
    const innerW = this.zoneWidth*0.4;
    zoneInner.style.left = ((this.zoneWidth-innerW)/2)+'px';
    zoneInner.style.width = '30%';
    zoneInner.style.left = '35%';

    this.pos = 0; this.dir=1;
    this.running = true;
    this.tickCount=0;
    this.loop();
  },
  loop(){
    if(!this.running) return;
    this.pos += this.speed*this.dir;
    if(this.pos>=1){ this.pos=1; this.dir=-1; }
    if(this.pos<=0){ this.pos=0; this.dir=1; }
    const track = document.getElementById('calib-track');
    const trackWidth = track.clientWidth;
    const indicator = document.getElementById('calib-indicator');
    indicator.style.left = (this.pos*(trackWidth-8))+'px';
    this.tickCount++;
    if(this.tickCount%14===0) Sound.calibTick();
    this.raf = requestAnimationFrame(()=>this.loop());
  },
  tap(){
    if(!this.running) return;
    this.running=false;
    cancelAnimationFrame(this.raf);
    document.getElementById('calib-tap').disabled=true;

    const center = this.zoneStart + this.zoneWidth/2;
    const dist = Math.abs(this.pos-center);
    const halfZone = this.zoneWidth/2;
    let grade;
    if(dist < halfZone*0.25) grade='PERFECT';
    else if(dist < halfZone*0.6) grade='GREAT';
    else if(dist < halfZone*1.15) grade='GOOD';
    else grade='MISS';

    this.applyGrade(grade);
  },
  applyGrade(grade){
    const resultEl = document.getElementById('calib-result');
    const buffsEl = document.getElementById('calib-buffs-preview');
    const colors = {PERFECT:'var(--perfect)', GREAT:'var(--great)', GOOD:'var(--good)', MISS:'var(--miss)'};
    const labels = {PERFECT:'✨ PERFECT!', GREAT:'GREAT!', GOOD:'GOOD', MISS:'MISS...'};
    resultEl.style.color = colors[grade];
    resultEl.textContent = labels[grade];
    resultEl.classList.add('show');

    const buffs = {atkMult:1, dmgReduction:0, captureEff:1, bonusEnergy:0, struggleAdd:0};
    if(grade==='PERFECT'){
      Sound.perfect(); screenShake();
      buffs.atkMult=1.10; buffs.dmgReduction=0.10; buffs.captureEff=1.05; buffs.bonusEnergy=1;
      buffsEl.textContent = '⚔攻擊+10% 🛡減傷+10% 🎣效率+5% ⚡額外能量+1';
    } else if(grade==='GREAT'){
      Sound.great();
      buffs.atkMult=1.05; buffs.dmgReduction=0.05;
      buffsEl.textContent = '⚔攻擊+5% 🛡減傷+5%';
    } else if(grade==='GOOD'){
      Sound.good();
      buffsEl.textContent = '沒有額外增益，正常進入戰鬥';
    } else {
      Sound.miss();
      buffs.struggleAdd = 0.05;
      buffsEl.textContent = '🐟 魚反抗力 +5%';
    }
    Game.battleBuffs = buffs;

    setTimeout(()=>{
      document.getElementById('calib-overlay').classList.remove('show');
      Battle.start(this.fish, buffs, grade);
    }, 1100);
  }
};
  /* =========================================================
   卡牌戰鬥
========================================================= */
const Battle = {
  fish:null, buffs:null,
  captureVal:0, captureMax:0,
  struggle:0,
  deck:[], hand:[], discard:[],
  energy:0, maxEnergy:3,
  turn:1, maxTurn:6,
  selected:null,
  luckyActive:false,
  pauseStruggle:false,
  fxCtx:null,

  start(fish, buffs, grade){
    this.fish = fish; this.buffs = buffs;
    this.captureMax = fish.captureMax;
    this.captureVal = fish.captureMax;
    this.struggle = fish.struggleBase;
    this.turn = 1;
    this.maxEnergy = 3 + (buffs.bonusEnergy||0);
    this.energy = this.maxEnergy;
    this.deck = shuffle([...STARTER_DECK]);
    this.discard = [];
    this.hand = [];
    this.luckyActive = false;
    this.pauseStruggle = false;

    document.getElementById('battle-fish-name').textContent = fish.emoji+' '+fish.name;
    document.getElementById('battle-fish-weak').textContent = fish.weaknessLabel;
    document.getElementById('battle-fish-sprite').textContent = fish.emoji;
    document.getElementById('battle-turn-max').textContent = this.maxTurn;
    const buffTags = [];
    if(grade==='PERFECT') buffTags.push('✨ PERFECT 校準');
    if(grade==='GREAT') buffTags.push('🟡 GREAT 校準');
    if(grade==='MISS') buffTags.push('🔴 校準失敗');
    document.getElementById('battle-buffs').innerHTML = buffTags.map(t=>`<span class="buff-tag">${t}</span>`).join('');
    this.log(grade==='PERFECT'?'完美校準！戰鬥優勢在握！': grade==='MISS' ? '校準失手，魚有點警覺...' : '校準完成，戰鬥開始！');

    this.fxCanvas = document.getElementById('battle-fx-canvas');
    this.resizeFx();
    this.fxCtx = this.fxCanvas.getContext('2d');
    this.particles = [];

    this.drawHand(true);
    this.renderAll();
    showScreen('screen-battle');
    this.loop();
  },
  resizeFx(){
    const rect = this.fxCanvas.parentElement.getBoundingClientRect();
    this.fxCanvas.width = rect.width; this.fxCanvas.height = rect.height;
  },
  loop(){
    if(!document.getElementById('screen-battle').classList.contains('active')) return;
    const ctx=this.fxCtx, cv=this.fxCanvas;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.02;
      if(p.life<=0){ this.particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(()=>this.loop());
  },
  burst(color,count=18){
    const cx = this.fxCanvas.width/2, cy = this.fxCanvas.height/2;
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2, spd = rand(1,5);
      this.particles.push({x:cx,y:cy, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2, life:1, size:rand(2,5), color});
    }
  },
  drawHand(full){
    if(full){
      this.hand = [];
      for(let i=0;i<3;i++) this.drawOne();
    }
    this.renderHand();
  },
  drawOne(){
    if(this.deck.length===0){
      if(this.discard.length===0) return;
      this.deck = shuffle(this.discard); this.discard=[];
    }
    const id = this.deck.pop();
    this.hand.push(id);
  },
  cardData(id){ return CARD_DB.find(c=>c.id===id); }
  ,
  renderHand(){
    const row = document.getElementById('hand-row');
    row.innerHTML='';
    this.hand.forEach((id,idx)=>{
      const c = this.cardData(id);
      const div = document.createElement('div');
      div.className = 'card '+c.type + (this.selected===idx?' selected':'') + (c.cost>this.energy?' disabled':'');
      div.innerHTML = `
        <div class="card-type"><span>${labelType(c.type)}</span><span>💧${c.cost}</span></div>
        <div class="card-icon">${c.icon}</div>
        <div class="card-name">${c.name}</div>
        <div class="card-desc">${c.desc.replace(/\n/g,'<br>')}</div>
      `;
      div.onclick = ()=>this.playCard(idx);
      row.appendChild(div);
    });
  },
  renderAll(){
    document.getElementById('battle-capture-num').textContent = `${fmtNum(this.captureVal)}/${this.captureMax}`;
    document.getElementById('battle-capture-bar').style.width = clamp(this.captureVal/this.captureMax*100,0,100)+'%';
    document.getElementById('battle-struggle-num').textContent = fmtNum(this.struggle);
    document.getElementById('battle-struggle-bar').style.width = clamp(this.struggle/30*100,0,100)+'%';
    document.getElementById('battle-turn').textContent = this.turn;
    const energyRow = document.getElementById('battle-energy');
    energyRow.innerHTML='';
    for(let i=0;i<this.maxEnergy;i++){
      const d = document.createElement('div');
      d.className = 'energy-dot'+(i<this.energy?' on':'');
      energyRow.appendChild(d);
    }
    this.renderHand();
  },
  log(msg){ document.getElementById('battle-log').textContent = msg; },

  playCard(idx){
    const id = this.hand[idx];
    const c = this.cardData(id);
    if(c.cost > this.energy){ toast('能量不足'); return; }
    Sound.click();
    this.energy -= c.cost;

    if(c.type==='attack'){
      let power = c.power * (this.buffs.atkMult||1);
      if(c.element!=='none' && c.element===this.fish.weakness) power *= 1.5;
      if(this.luckyActive){ power *= 1.5; this.luckyActive=false; }
      this.captureVal = Math.max(0, this.captureVal - power);
      Sound.cardAttack(); screenShakeSmall();
      this.burst(c.element==='thunder' ? '#f7e34d':'#ff8a5c', 20);
      this.log(`使用「${c.name}」，捕獲值 -${fmtNum(power)}${(c.element!=='none'&&c.element===this.fish.weakness)?'（剋制弱點！）':''}`);
      if(c.draw) this.drawOne();
    } else if(c.type==='defense'){
      this._shield = (this._shield||0) + c.power;
      Sound.cardDefense();
      this.burst('#4fa0e0', 14);
      this.log(`使用「${c.name}」，減少下回合反抗來源 ${c.power}`);
    } else if(c.type==='skill'){
      Sound.cardSkill();
      this.burst('#c76ce0', 14);
      if(id==='skill_pause'){ this.pauseStruggle = true; this.log('使用「暫停反抗」，魚本回合不會反抗！'); }
      if(id==='skill_redraw'){ this.discard.push(...this.hand); this.hand=[]; this.drawHand(true); this.log('重抽了整手牌'); }
    } else if(c.type==='support'){
      Sound.cardSupport();
      this.burst('#6ee08d', 14);
      if(id==='sup_lucky'){ this.luckyActive = true; this.log('下一張攻擊卡威力提升 50%！'); }
      if(id==='sup_energy'){ this.energy = Math.min(this.maxEnergy+2, this.energy+1); this.log('獲得 1 點額外能量'); }
    }

    this.discard.push(id);
    this.hand.splice(idx,1);
    this.renderAll();

    if(this.captureVal<=0){ setTimeout(()=>this.victory(),400); return; }
  },
  endTurn(){
    if(this.captureVal<=0) return;
    Sound.click();
    if(!this.pauseStruggle){
      let inc = this.struggle - (this._shield||0);
      inc = Math.max(2, inc) * (1+(this.buffs.struggleAdd||0));
      this.captureVal = Math.min(this.captureMax, this.captureVal + inc);
      this.log(`魚奮力掙扎！捕獲值回升 ${fmtNum(inc)}`);
      this.burst('#ff5c5c', 10);
      screenShakeSmall();
    } else {
      this.log('魚被暫時壓制，沒有反抗！');
    }
    this._shield = 0;
    this.pauseStruggle = false;
    this.turn++;
    this.energy = this.maxEnergy;
    this.discard.push(...this.hand); this.hand=[];
    this.drawHand(true);
    this.renderAll();

    if(this.captureVal<=0){ setTimeout(()=>this.victory(),300); return; }
    if(this.turn>this.maxTurn){ setTimeout(()=>this.escape(),300); return; }
  },
  victory(){
    Sound.victory();
    this.burst('#ffd76a', 40);
    const weight = rand(this.fish.weightRange[0], this.fish.weightRange[1]).toFixed(1);
    const codex = Game.save.codex;
    const prev = codex[this.fish.id];
    const isFirst = !prev;
    const isRecord = !prev || weight > prev.maxWeight;
    codex[this.fish.id] = {
      count: (prev?prev.count:0)+1,
      maxWeight: isRecord ? Number(weight) : prev.maxWeight,
      lastCaught: Game.save.name,
    };
    Game.save.totalCaught = (Game.save.totalCaught||0)+1;
    Save.persist();
    Game.updateCodexHud();

    document.getElementById('result-fish-emoji').textContent = this.fish.emoji;
    document.getElementById('result-fish-name').textContent = this.fish.name;
    document.getElementById('result-fish-rarity').textContent = '★'.repeat(this.fish.rarity)+'☆'.repeat(5-this.fish.rarity);
    document.getElementById('result-stats').innerHTML = `
      棲息地：<b>${this.fish.habitat}</b><br>
      重量：<b>${weight} kg</b> ${isRecord?'🏆 新紀錄！':''}<br>
      ${isFirst?'✅ 首次捕獲！':'累積捕獲：<b>'+codex[this.fish.id].count+'</b> 次'}<br>
      使用回合數：<b>${this.turn}</b>
    `;
    setTimeout(()=>showScreen('screen-result'), 500);
  },
  escape(){
    Sound.fail();
    toast('魚掙脫逃走了...');
    showScreen('screen-fishing');
    Fishing.reset();
  }
};
function labelType(t){
  return {attack:'⚔攻擊',defense:'🛡防禦',skill:'⚡技能',support:'🍀輔助'}[t]||t;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function screenShakeSmall(){
  const el = document.getElementById('screen-battle');
  el.style.transition='transform .05s';
  el.style.transform='translate(3px,-2px)';
  setTimeout(()=>{ el.style.transform='translate(-2px,2px)'; }, 60);
  setTimeout(()=>{ el.style.transform='translate(0,0)'; }, 120);
}
