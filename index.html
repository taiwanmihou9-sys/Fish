<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>漂流釣客 Drift Angler</title>
<style>
  :root{
    --navy:#0a1626; --navy2:#122238; --ink:#eaf2ff; --accent:#ff9d3d; --accent2:#ffc06b;
    --green:#3ddc84; --yellow:#ffd23d; --red:#ff4d4d; --line:#4fa3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--ink);}
  #game-canvas{position:fixed;inset:0;display:block;width:100%;height:100%;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .ui-el{pointer-events:auto;}

  /* ---------- Intro ---------- */
  #intro{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-bottom:8vh;transition:opacity 1.5s ease;}
  #intro .line{font-size:1.15rem;letter-spacing:2px;opacity:0;margin:6px 0;text-align:center;
    text-shadow:0 0 12px rgba(0,0,0,.8);transition:opacity 1.6s ease;}
  #intro .line.show{opacity:1;}
  #startBtn{margin-top:36px;padding:14px 38px;font-size:1.05rem;letter-spacing:3px;background:linear-gradient(180deg,var(--accent2),var(--accent));
    border:none;border-radius:30px;color:#1a0f00;font-weight:700;cursor:pointer;opacity:0;transition:opacity 1.2s ease, transform .15s;
    box-shadow:0 6px 24px rgba(255,157,61,.35);}
  #startBtn.show{opacity:1;}
  #startBtn:active{transform:scale(.95);}
  #loadingTip{position:absolute;bottom:14px;font-size:.7rem;color:#7d93b3;letter-spacing:1px;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;font-size:.8rem;display:none;}
  .panel{background:linear-gradient(180deg,rgba(10,22,38,.82),rgba(10,22,38,.62));
    border:1px solid rgba(255,255,255,.08); border-radius:12px; backdrop-filter:blur(4px);}
  #topLeft{position:absolute;top:14px;left:14px;padding:10px 14px;min-width:170px;}
  #topLeft .row{display:flex;justify-content:space-between;gap:14px;margin:2px 0;}
  #topLeft .label{color:#8fa9cc;}
  #topRight{position:absolute;top:14px;right:14px;padding:10px 14px;text-align:right;min-width:130px;}
  #bottomLeft{position:absolute;bottom:14px;left:14px;padding:8px 12px;font-size:.72rem;color:#bcd0ee;}
  #promptWrap{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);text-align:center;}
  .prompt{padding:6px 16px;margin-bottom:8px;color:#ffe9cf;font-size:.85rem;letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,.7);}
  .bigBtn{pointer-events:auto;padding:12px 30px;border-radius:30px;border:1px solid rgba(255,255,255,.25);
    background:linear-gradient(180deg,var(--accent2),var(--accent));color:#1a0f00;font-weight:700;
    letter-spacing:2px;font-size:.95rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .bigBtn:active{transform:scale(.96);}
  .ghostBtn{pointer-events:auto;padding:10px 22px;border-radius:24px;border:1px solid rgba(255,255,255,.3);
    background:rgba(10,22,38,.7);color:var(--ink);font-size:.85rem;letter-spacing:1px;cursor:pointer;}

  /* ---------- Joystick & mobile controls ---------- */
  #joyZone{position:absolute;left:24px;bottom:24px;width:130px;height:130px;pointer-events:auto;}
  #joyBase{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);}
  #joyStick{position:absolute;width:56px;height:56px;left:37px;top:37px;border-radius:50%;
    background:rgba(255,157,61,.55);border:2px solid rgba(255,255,255,.5);}
  #actionBtns{position:absolute;right:18px;bottom:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .actBtn{pointer-events:auto;width:88px;padding:12px 0;text-align:center;border-radius:16px;
    background:rgba(10,22,38,.75);border:1px solid rgba(255,255,255,.25);color:var(--ink);font-size:.82rem;font-weight:600;}
  .actBtn:active{background:rgba(255,157,61,.5);}

  /* ---------- Fishing UI ---------- */
  #fishingUI{position:absolute;inset:0;display:none;}
  #tensionWrap{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(78vw,420px);}
  #tensionLabel{text-align:center;font-size:.72rem;letter-spacing:2px;color:#bcd0ee;margin-bottom:4px;}
  #tensionBar{position:relative;width:100%;height:22px;border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.3);background:#0d1a2b;}
  #zoneGreen{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.35);}
  #tensionFill{position:absolute;top:0;bottom:0;left:0;width:0%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));}
  #tensionNeedle{position:absolute;top:-4px;width:3px;height:30px;background:#fff;left:0%;box-shadow:0 0 6px #fff;}
  #lineDurWrap{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(60vw,300px);}
  #lineDurBar{width:100%;height:6px;border-radius:4px;background:#0d1a2b;overflow:hidden;border:1px solid rgba(255,255,255,.2);}
  #lineDurFill{height:100%;width:100%;background:var(--line);}
  #fishInfoBox{position:absolute;top:100px;right:16px;padding:10px 14px;font-size:.75rem;text-align:right;display:none;}
  #reelControls{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:14px;}
  #reelControls button{pointer-events:auto;padding:14px 22px;border-radius:26px;border:1px solid rgba(255,255,255,.3);
    font-weight:700;letter-spacing:1px;font-size:.9rem;cursor:pointer;}
  #reelIn{background:linear-gradient(180deg,#4fd88a,#28a35a);color:#062;}
  #reelOut{background:linear-gradient(180deg,#ffce6b,#e08a1f);color:#3a1c00;}
  #castBtn,#stopFishBtn,#endFishBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;}
  #fishMsg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:1.3rem;font-weight:700;
    letter-spacing:3px;text-shadow:0 0 18px rgba(0,0,0,.8),0 0 6px var(--accent);opacity:0;transition:opacity .25s;text-align:center;}

  /* ---------- Catch result ---------- */
  #catchPanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:22px 28px;width:min(84vw,340px);
    text-align:center;display:none;pointer-events:auto;}
  #catchPanel h2{margin:0 0 4px;color:var(--accent2);letter-spacing:2px;font-size:1rem;}
  #catchFishName{font-size:1.4rem;margin:8px 0;color:#fff;}
  #catchStats{font-size:.82rem;line-height:1.7;color:#cfe0f7;margin-bottom:14px;}
  #catchBtns{display:flex;gap:10px;justify-content:center;}

  /* ---------- Port / Shop ---------- */
  #portPanel{position:absolute;inset:0;background:rgba(6,12,22,.92);display:none;pointer-events:auto;
    overflow-y:auto; padding:20px 16px 100px;}
  #portPanel h1{color:var(--accent2);letter-spacing:3px;font-size:1.2rem;margin:6px 0 14px;text-align:center;}
  .tabRow{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .tabBtn{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);
    color:#cfe0f7;font-size:.8rem;cursor:pointer;}
  .tabBtn.active{background:var(--accent);color:#1a0f00;font-weight:700;border-color:var(--accent);}
  .shopSection{display:none;}
  .shopSection.active{display:block;}
  .itemCard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .itemCard .info{flex:1;}
  .itemCard .name{font-weight:700;font-size:.9rem;color:#fff;}
  .itemCard .desc{font-size:.72rem;color:#9db3d6;margin-top:2px;}
  .itemCard button{padding:8px 14px;border-radius:16px;border:none;background:var(--accent);color:#1a0f00;font-weight:700;font-size:.75rem;cursor:pointer;white-space:nowrap;}
  .itemCard button:disabled{background:#445266;color:#8b96a8;}
  .itemCard.owned{opacity:.55;}
  #closePort{position:fixed;top:16px;right:16px;z-index:5;}
  #moneyBigDisplay{text-align:center;color:var(--accent2);font-size:1.1rem;margin-bottom:10px;}
  .missionCard{background:rgba(255,157,61,.08);border:1px solid rgba(255,157,61,.3);}

  #toast{position:absolute;top:110px;left:50%;transform:translate(-50%,-10px);padding:8px 18px;border-radius:20px;
    font-size:.8rem;opacity:0;transition:all .3s;pointer-events:none;}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  .hidden{display:none !important;}
  @media (orientation: portrait){
    #rotateHint{position:fixed;inset:0;background:#000;z-index:200;color:#fff;display:none;
      align-items:center;justify-content:center;text-align:center;padding:30px;font-size:1rem;letter-spacing:1px;}
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="intro">
  <div class="line" id="l1">有時候，人不是想找到什麼。</div>
  <div class="line" id="l2">只是想離開一下。</div>
  <button id="startBtn">開 始 漂 流</button>
  <div id="loadingTip">點擊畫面以啟用聲音與控制</div>
</div>

<div id="rotateHint">請將裝置橫向以獲得最佳體驗<br/>（也可直向繼續遊玩）</div>

<div id="hud">
  <div id="topLeft" class="panel">
    <div class="row"><span class="label">釣客</span><span>老陳</span></div>
    <div class="row"><span class="label">金錢</span><span id="hudMoney">$0</span></div>
    <div class="row"><span class="label">魚桶</span><span id="hudBucket">0/10</span></div>
    <div class="row"><span class="label">海域</span><span id="hudZone">新手海域</span></div>
  </div>
  <div id="topRight" class="panel">
    <div class="row"><span class="label">天氣</span><span id="hudWeather">晴天</span></div>
    <div class="row"><span class="label">時間</span><span id="hudTime">06:00</span></div>
  </div>
  <div id="bottomLeft" class="panel">
    <div>船速 <span id="hudSpeed">0</span> kn</div>
  </div>

  <div id="promptWrap"></div>

  <div id="joyZone">
    <div id="joyBase"></div>
    <div id="joyStick"></div>
  </div>
  <div id="actionBtns">
    <div class="actBtn" id="btnPort">港口</div>
    <div class="actBtn" id="btnSave">儲存</div>
  </div>

  <div id="fishingUI">
    <div id="tensionWrap" class="panel" style="padding:8px 12px;">
      <div id="tensionLabel">魚線張力</div>
      <div id="tensionBar">
        <div id="zoneGreen"></div>
        <div id="tensionFill"></div>
        <div id="tensionNeedle"></div>
      </div>
    </div>
    <div id="lineDurWrap">
      <div id="lineDurBar"><div id="lineDurFill"></div></div>
    </div>
    <div id="fishInfoBox" class="panel"></div>
    <div id="fishMsg"></div>
    <button class="bigBtn" id="castBtn">拋 竿</button>
    <button class="ghostBtn" id="stopFishBtn" style="display:none;">停止釣魚</button>
    <div id="reelControls" style="display:none;">
      <button id="reelOut">放線 ▼</button>
      <button id="reelIn">收線 ▲</button>
    </div>
    <button class="ghostBtn hidden" id="endFishBtn" style="bottom:auto;top:16px;left:16px;right:auto;transform:none;position:absolute;">← 結束釣魚</button>
  </div>

  <div id="catchPanel" class="panel">
    <h2>捕獲紀錄</h2>
    <div id="catchFishName">鯖魚</div>
    <div id="catchStats"></div>
    <div id="catchBtns">
      <button class="bigBtn" id="keepFishBtn">收進魚桶</button>
      <button class="ghostBtn" id="releaseFishBtn">放生</button>
    </div>
  </div>

  <div id="toast" class="panel"></div>
</div>

<div id="portPanel">
  <button class="ghostBtn" id="closePort">離開港口</button>
  <h1>漂流港 · 補給站</h1>
  <div id="moneyBigDisplay">持有金錢：$0</div>
  <div class="tabRow">
    <div class="tabBtn active" data-tab="market">魚市場</div>
    <div class="tabBtn" data-tab="rod">釣具店</div>
    <div class="tabBtn" data-tab="boatshop">船舶商店</div>
    <div class="tabBtn" data-tab="mission">任務</div>
  </div>
  <div class="shopSection active" id="tab-market"></div>
  <div class="shopSection" id="tab-rod"></div>
  <div class="shopSection" id="tab-boatshop"></div>
  <div class="shopSection" id="tab-mission"></div>
</div>

<script type="module">
import * as THREE from "three";

/* =========================================================================
   DRIFT ANGLER — 漂流釣客
   Single-file Three.js 3D drift-fishing game.
   ========================================================================= */

/* ---------------------------- Utility ---------------------------------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const rand = (a,b)=>a+Math.random()*(b-a);
const choice = arr=>arr[Math.floor(Math.random()*arr.length)];

/* Wave function shared by shader (GLSL) and JS (for boat physics) */
function waveHeight(x,z,t){
  let y = 0;
  y += Math.sin(x*0.04 + t*0.9) * 0.55;
  y += Math.sin(z*0.06 + t*0.6) * 0.35;
  y += Math.sin((x+z)*0.03 - t*1.3) * 0.4;
  y += Math.sin((x*0.09 - z*0.05) + t*1.8) * 0.15;
  return y;
}
function waveNormalApprox(x,z,t){
  const e=0.6;
  const hL = waveHeight(x-e,z,t), hR = waveHeight(x+e,z,t);
  const hD = waveHeight(x,z-e,t), hU = waveHeight(x,z+e,t);
  const dx = (hR-hL)/(2*e), dz=(hU-hD)/(2*e);
  return new THREE.Vector3(-dx,1,-dz).normalize();
}

/* ---------------------------- Game State -------------------------------- */
const state = {
  mode: "intro", // intro | thirdperson | fishing | port
  time: 6.0,        // hours 0-24
  timeSpeed: 0.02,   // hours per second
  weather: "sunny",  // sunny | cloudy | sunset(derived) | rain | storm
  weatherTimer: 40,
  money: 300,
  bucket: [],
  bucketCap: 10,
  rod: 0,   // index into RODS
  boatTier: 0, // index into BOATS
  hookUnlocked:0,
  missions: [],
  stats: { totalCaught:0, totalRareCaught:0 },
};

const RODS = [
  {name:"破舊釣竿", power:30, control:40, durability:30, price:0},
  {name:"中級釣竿", power:50, control:60, durability:50, price:800},
  {name:"高級釣竿", power:80, control:80, durability:80, price:2500},
  {name:"傳說釣竿", power:100, control:100, durability:100, price:6000},
];
const BOATS = [
  {name:"破舊小漁船", speed:1.0, handling:1.0, cap:10, price:0},
  {name:"中型漁船", speed:1.4, handling:1.25, cap:20, price:1500},
  {name:"大型漁船", speed:1.8, handling:1.5, cap:40, price:5000},
];
const BUCKET_UPGRADES = [10,20,30,50,100];

const FISH_DB = [
  // region, name, minKg,maxKg, rarity(1-5), basePrice/kg, strength(0-100), speed(0-100), timeOfDay(any/dawn/day/dusk/night)
  {region:"novice", name:"沙丁魚", min:0.2,max:0.6, rarity:1, price:18, strength:10, speed:20, tod:"any"},
  {region:"novice", name:"鯖魚", min:0.4,max:1.2, rarity:1, price:26, strength:15, speed:30, tod:"any"},
  {region:"novice", name:"小鯛魚", min:0.5,max:1.5, rarity:2, price:40, strength:20, speed:25, tod:"day"},
  {region:"mid", name:"鯛魚", min:1.5,max:3.5, rarity:2, price:60, strength:35, speed:35, tod:"day"},
  {region:"mid", name:"鰹魚", min:2.0,max:5.0, rarity:2, price:75, strength:45, speed:55, tod:"any"},
  {region:"mid", name:"鮪魚", min:5.0,max:12.0, rarity:3, price:110, strength:60, speed:60, tod:"any"},
  {region:"deep", name:"大型鮪魚", min:15.0,max:40.0, rarity:4, price:220, strength:80, speed:65, tod:"any"},
  {region:"deep", name:"劍魚", min:20.0,max:55.0, rarity:4, price:280, strength:90, speed:80, tod:"dusk"},
  {region:"deep", name:"巨型魚", min:40.0,max:90.0, rarity:5, price:420, strength:95, speed:50, tod:"night"},
  {region:"rare", name:"金色魚", min:3.0,max:8.0, rarity:5, price:600, strength:70, speed:85, tod:"dusk"},
  {region:"rare", name:"發光魚", min:2.0,max:6.0, rarity:5, price:750, strength:60, speed:90, tod:"night"},
  {region:"rare", name:"傳說魚", min:30.0,max:70.0, rarity:5, price:1500, strength:98, speed:70, tod:"any"},
];

/* ---------------------------- Renderer / Scene --------------------------- */
const canvas = document.getElementById("game-canvas");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8fb3c9, 0.0032);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0,6,12);

/* Lighting */
const hemi = new THREE.HemisphereLight(0xbcd7f0, 0x2b3d33, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-60; sun.shadow.camera.right=60; sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60;
sun.shadow.camera.far=250;
scene.add(sun);
scene.add(sun.target);

/* Sky via large sphere with gradient shader */
const skyGeo = new THREE.SphereGeometry(1200, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms:{
    topColor:{value:new THREE.Color(0x3d7fc9)},
    bottomColor:{value:new THREE.Color(0xcfe9ff)},
    offset:{value:20}, exponent:{value:0.7}
  },
  vertexShader:`varying vec3 vWorldPos; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWorldPos=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`
    uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent;
    varying vec3 vWorldPos;
    void main(){
      float h = normalize(vWorldPos + vec3(0.0, offset,0.0)).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0),exponent),0.0)),1.0);
    }`
});
const skyDome = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyDome);

/* Sun visual disc */
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(18,24), new THREE.MeshBasicMaterial({color:0xfff2c0, transparent:true, opacity:.9}));
scene.add(sunDisc);

/* Clouds: simple flat billboards */
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
(function buildClouds(){
  const cloudTexCanvas = document.createElement("canvas");
  cloudTexCanvas.width=128; cloudTexCanvas.height=64;
  const cx = cloudTexCanvas.getContext("2d");
  const grad = cx.createRadialGradient(64,32,4,64,32,60);
  grad.addColorStop(0,"rgba(255,255,255,0.9)");
  grad.addColorStop(1,"rgba(255,255,255,0)");
  cx.fillStyle=grad; cx.fillRect(0,0,128,64);
  const tex = new THREE.CanvasTexture(cloudTexCanvas);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, opacity:.85});
  for(let i=0;i<40;i++){
    const s = new THREE.Sprite(mat);
    const scl = rand(40,110);
    s.scale.set(scl, scl*0.45, 1);
    s.position.set(rand(-900,900), rand(140,260), rand(-900,900));
    cloudGroup.add(s);
  }
})();

/* Birds: simple V shapes, animated bobbing/flying */
const birds=[];
(function buildBirds(){
  const birdMat = new THREE.MeshBasicMaterial({color:0x27313d});
  for(let i=0;i<10;i++){
    const shape = new THREE.Group();
    const wingGeo = new THREE.PlaneGeometry(1.4,0.35);
    const l = new THREE.Mesh(wingGeo, birdMat); l.rotation.z=0.5; l.position.x=-0.6;
    const r = new THREE.Mesh(wingGeo, birdMat); r.rotation.z=-0.5; r.position.x=0.6;
    shape.add(l,r);
    shape.position.set(rand(-200,200), rand(30,60), rand(-200,200));
    shape.userData.phase = rand(0,10);
    shape.userData.radius = rand(60,180);
    shape.userData.center = new THREE.Vector2(shape.position.x, shape.position.z);
    scene.add(shape);
    birds.push(shape);
  }
})();

/* ---------------------------- Ocean -------------------------------------- */
const OCEAN_SIZE = 2000;
const oceanGeo = new THREE.PlaneGeometry(OCEAN_SIZE, OCEAN_SIZE, 180, 180);
oceanGeo.rotateX(-Math.PI/2);
const oceanMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uDeep:{value:new THREE.Color(0x04314f)},
    uShallow:{value:new THREE.Color(0x1f7fa8)},
    uFoam:{value:new THREE.Color(0xdff4ff)},
    uSunDir:{value:new THREE.Vector3(0.4,0.8,0.3)},
    uSunColor:{value:new THREE.Color(0xfff2d8)},
    uOpacity:{value:0.94},
    uRain:{value:0.0},
  },
  transparent:true,
  vertexShader:`
    uniform float uTime;
    varying vec3 vWorldPos; varying vec3 vNormalW; varying float vHeight;
    ${'' /* wave fn duplicated in glsl */}
    float waveH(float x, float z, float t){
      float y = 0.0;
      y += sin(x*0.04 + t*0.9) * 0.55;
      y += sin(z*0.06 + t*0.6) * 0.35;
      y += sin((x+z)*0.03 - t*1.3) * 0.4;
      y += sin((x*0.09 - z*0.05) + t*1.8) * 0.15;
      return y;
    }
    void main(){
      vec3 pos = position;
      float t = uTime;
      float h = waveH(pos.x, pos.z, t);
      pos.y += h;
      float e = 0.6;
      float hl = waveH(pos.x-e,pos.z,t); float hr = waveH(pos.x+e,pos.z,t);
      float hd = waveH(pos.x,pos.z-e,t); float hu = waveH(pos.x,pos.z+e,t);
      vec3 n = normalize(vec3(-(hr-hl)/(2.0*e), 1.0, -(hu-hd)/(2.0*e)));
      vNormalW = n;
      vHeight = h;
      vec4 wp = modelMatrix * vec4(pos,1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader:`
    uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uFoam;
    uniform vec3 uSunDir; uniform vec3 uSunColor; uniform float uOpacity; uniform float uRain;
    varying vec3 vWorldPos; varying vec3 vNormalW; varying float vHeight;
    void main(){
      float fres = pow(1.0 - clamp(dot(normalize(vNormalW), vec3(0.0,1.0,0.0)),0.0,1.0), 3.0);
      vec3 base = mix(uDeep, uShallow, clamp(vHeight*0.5+0.5,0.0,1.0));
      float diff = clamp(dot(normalize(vNormalW), normalize(uSunDir)), 0.0, 1.0);
      vec3 col = base + uSunColor*diff*0.35;
      float spec = pow(clamp(dot(reflect(-normalize(uSunDir), normalize(vNormalW)), vec3(0.0,0.0,1.0)),0.0,1.0), 40.0);
      col += uSunColor * spec * 0.6;
      col = mix(col, uFoam, fres*0.35);
      float crest = smoothstep(0.55,0.9,vHeight);
      col = mix(col, uFoam, crest*0.5);
      col = mix(col, vec3(0.55,0.6,0.65), uRain*0.35);
      gl_FragColor = vec4(col, uOpacity);
    }
  `
});

class SplashPool{
  constructor(count=60){
    this.geo = new THREE.SphereGeometry(0.14,5,4);
    this.mat = new THREE.MeshBasicMaterial({color:0xeaf6ff, transparent:true});
    this.pool=[];
    for(let i=0;i<count;i++){
      const m = new THREE.Mesh(this.geo, this.mat.clone());
      m.visible=false;
      scene.add(m);
      this.pool.push({mesh:m, vel:new THREE.Vector3(), life:0, active:false});
    }
  }
  burst(pos, n=14, power=2.2){
    let spawned=0;
    for(const p of this.pool){
      if(p.active) continue;
      p.active=true; p.life=0.5+Math.random()*0.3;
      p.mesh.visible=true;
      p.mesh.position.copy(pos);
      const ang = Math.random()*Math.PI*2;
      const spd = power*(0.4+Math.random()*0.8);
      p.vel.set(Math.cos(ang)*spd, rand(2,4.2)*power*0.5, Math.sin(ang)*spd);
      p.mesh.scale.setScalar(rand(0.5,1.1));
      spawned++;
      if(spawned>=n) break;
    }
  }
  update(dt){
    for(const p of this.pool){
      if(!p.active) continue;
      p.life -= dt;
      p.vel.y -= 9.8*dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.material.opacity = clamp(p.life/0.5,0,1);
      if(p.life<=0 || p.mesh.position.y < -1){ p.active=false; p.mesh.visible=false; }
    }
  }
}

  let best=null, bd=Infinity;
  for(const zn of ZONES){
    const d = Math.hypot(x-zn.center.x, z-zn.center.y);
    if(d<zn.radius && d<bd){best=zn; bd=d;}

}

class Shoal{
  constructor(zone){
    this.zone = zone;
    const a = Math.random()*Math.PI*2, d = Math.random()*zone.radius*0.7;
    this.center = new THREE.Vector3(zone.center.x+Math.cos(a)*d, -0.8, zone.center.y+Math.sin(a)*d);
    this.radius = rand(4,7);
    this.group = new THREE.Group();
    this.group.position.copy(this.center);
    scene.add(this.group);
    this.fish=[];
    const n = Math.floor(rand(6,11));
    for(let i=0;i<n;i++){
      const m = buildFishMesh(rand(0.6,1.1));
      m.position.set(rand(-this.radius,this.radius), rand(-1,0.5), rand(-this.radius,this.radius));
      m.userData.phase = Math.random()*10;
      m.userData.speed = rand(0.5,1.2);
      this.group.add(m);
      this.fish.push(m);
    }
    this.active = true;
  }
  update(dt,t, boatPos){
    const distToBoat = this.group.position.distanceTo(boatPos);
    const scared = distToBoat < 6;
    for(const f of this.fish){
      const ph = f.userData.phase + t*f.userData.speed*(scared?2.4:1);
      const r = this.radius*(scared?1.6:1);
      f.position.x = Math.sin(ph)*r*0.6;
      f.position.z = Math.cos(ph*0.8)*r*0.6;
      f.position.y = -1 + Math.sin(ph*2)*0.3;
      f.rotation.y = ph;
    }
    if(scared){
      const away = new THREE.Vector3().subVectors(this.group.position, boatPos).normalize();
      this.group.position.addScaledVector(away, dt*3);
    }
  }
}

/* ---------------------------- Boat physics ---------------------------------- */
const boatPhys = {
  pos: new THREE.Vector3(0,0,0),
  heading: 0,
  speed: 0,
  turnRate: 0,
};
function boatMaxSpeed(){ return 9 * BOATS[state.boatTier].speed; }
function updateBoat(dt,t){
  let throttle = 0, steer = 0;
  if(keys["KeyW"]||keys["ArrowUp"]) throttle += 1;
  if(keys["KeyS"]||keys["ArrowDown"]) throttle -= 1;
  if(keys["KeyA"]||keys["ArrowLeft"]) steer += 1;
  if(keys["KeyD"]||keys["ArrowRight"]) steer -= 1;
  if(joy.active){ throttle += clamp(-joy.dy,-1,1); steer += clamp(-joy.dx,-1,1); }
  throttle = clamp(throttle,-1,1); steer = clamp(steer,-1,1);

  const handling = BOATS[state.boatTier].handling;
  boatPhys.turnRate = lerp(boatPhys.turnRate, steer*0.9*handling, dt*3);
  boatPhys.heading += boatPhys.turnRate*dt*(0.4+Math.min(Math.abs(boatPhys.speed)/6,1));
  const targetSpeed = throttle*boatMaxSpeed();
  boatPhys.speed = lerp(boatPhys.speed, targetSpeed, dt*1.2);

  const dir = new THREE.Vector3(Math.cos(boatPhys.heading),0,Math.sin(boatPhys.heading));
  boatPhys.pos.addScaledVector(dir, boatPhys.speed*dt);
  boatPhys.pos.x = clamp(boatPhys.pos.x,-OCEAN_SIZE/2+20, OCEAN_SIZE/2-20);
  boatPhys.pos.z = clamp(boatPhys.pos.z,-OCEAN_SIZE/2+20, OCEAN_SIZE/2-20);

  const h = waveHeight(boatPhys.pos.x, boatPhys.pos.z, t) * weatherWaveMul();
  const n = waveNormalApprox(boatPhys.pos.x, boatPhys.pos.z, t);
  boat.position.set(boatPhys.pos.x, h+0.05, boatPhys.pos.z);
  boat.rotation.y = -boatPhys.heading + Math.PI/2;
  // tilt with wave normal + speed based pitch
  const tiltZ = clamp(n.x*0.5,-0.25,0.25);
  const tiltX = clamp(-n.z*0.5,-0.25,0.25) - clamp(boatPhys.speed*0.01,0,0.08);
  boat.rotation.z = lerp(boat.rotation.z, tiltZ, dt*3);
  boat.rotation.x = lerp(boat.rotation.x, tiltX, dt*3);

  // wake splash when moving fast
  if(Math.abs(boatPhys.speed) > 2 && Math.random()<0.5){
    const back = new THREE.Vector3(-Math.cos(boatPhys.heading), 0, -Math.sin(boatPhys.heading));
    const p = boat.position.clone().addScaledVector(back, 2.0);
    p.y = h+0.1;
    splashPool.burst(p, Math.min(4,Math.floor(Math.abs(boatPhys.speed)/2)), 1.0+Math.abs(boatPhys.speed)*0.15);
  }
  updateHudSpeed();
}
function weatherWaveMul(){
  if(state.weather==="storm") return 2.0;
  if(state.weather==="rain") return 1.4;
  return 1.0;
}

  camera.lookAt(camRig.curLook);
}

const fish_state = {
  phase:"idle", // idle | transitioning | ready | casting | waiting | bite | reeling | success | fail
  currentSpot:null,
  tension:0.35, // 0..1
  fishStamina:1,
  fishDistance:1, // 1 far -> 0 caught

  weight:0,

};

function startCast(){
  if(fish_state.phase!=="ready") return;
  fish_state.phase="casting";
  el("castBtn").style.display="none";
  el("stopFishBtn").style.display="inline-block";
  // animate rod forward then release
  rodGroup.userData.castAnim = 0;
  setTimeout(()=>{
    fish_state.phase="waiting";
    bobber.visible=true;
    fishingLine.visible=true;
    const dist = rand(6,11);
    const dir = new THREE.Vector3(Math.cos(-boatPhys.heading), 0, Math.sin(-boatPhys.heading));
    const target = boat.position.clone().addScaledVector(dir, dist);
    target.y = waveHeight(target.x,target.z, clock.elapsedTime)+0.1;
    bobber.position.copy(target);
    splashPool.burst(target, 10, 1.6);
    // bite timer depends on shoal proximity
    let base = rand(2.5,6);
    if(nearShoal){
      const d = nearShoal.group.position.distanceTo(target);
      if(d < nearShoal.radius+3) base *= 0.55;
    }
    fish_state.biteTimer = base;
  }, 550);
}
function stopFishingCast(){
  // cancel current cast/wait, go back to ready
  fish_state.phase="ready";
  bobber.visible=false; fishingLine.visible=false;

}

function pickSpeciesForZone(){
  const zn = zoneAt(boatPhys.pos.x, boatPhys.pos.z);
  const region = regionForZone(zn.key);
  let pool = FISH_DB.filter(f=>f.region===region);
  const hh = Math.floor(state.time)%24;
  const tod = hh<6?"night": hh<11?"dawn": hh<17?"day": hh<20?"dusk":"night";
  const weighted = [];
  for(const f of pool){
    let w = 6 - f.rarity;
    if(f.tod===tod || f.tod==="any") w*=2;
    for(let i=0;i<Math.max(1,Math.floor(w));i++) weighted.push(f);
  }
  if(weighted.length===0) weighted.push(...FISH_DB.filter(f=>f.region==="novice"));
  return choice(weighted);
}
function startMinigame(){

let reelInHeld=false, reelOutHeld=false;
function bindHold(elm, onFn, offFn){
  elm.addEventListener("pointerdown", e=>{ e.preventDefault(); onFn(); });
  elm.addEventListener("pointerup", ()=>offFn());
  elm.addEventListener("pointerleave", ()=>offFn());
  elm.addEventListener("touchstart", e=>{ e.preventDefault(); onFn(); },{passive:false});
  elm.addEventListener("touchend", e=>{ e.preventDefault(); offFn(); },{passive:false});
}
bindHold(el("reelIn"), ()=>reelInHeld=true, ()=>reelInHeld=false);
bindHold(el("reelOut"), ()=>reelOutHeld=true, ()=>reelOutHeld=false);
window.addEventListener("keydown", e=>{ if(e.code==="Space") reelInHeld=true; if(e.code==="ShiftLeft") reelOutHeld=true; });
window.addEventListener("keyup", e=>{ if(e.code==="Space") reelInHeld=false; if(e.code==="ShiftLeft") reelOutHeld=false; });

function updateMinigame(dt,t){
  if(fish_state.phase!=="reeling") return;
  const rod = RODS[state.rod];
  const sp = fish_state.species;
  // fish pulls tension around based on its strength/speed randomly
  const pull = Math.sin(t*(1.2+sp.speed*0.02) + sp.strength*0.01)*0.006*(sp.strength/40);
  fish_state.tension += pull;
  if(reelInHeld){
    fish_state.tension += (0.012 + sp.strength*0.0003) * dt*60*0.02;
    fish_state.fishDistance -= (0.06 + rod.power*0.0009) * dt * (1 - fish_state.tension*0.3);
    fish_state.fishStamina -= 0.05*dt*(fish_state.tension>0.35&&fish_state.tension<0.75?1.4:0.4);
  } else if(reelOutHeld){
    fish_state.tension -= 0.02*dt*60*0.03;
    fish_state.fishDistance += 0.03*dt;
  } else {
    fish_state.tension -= 0.004*dt*60*0.02;
  }
  fish_state.tension = clamp(fish_state.tension,0,1);
  fish_state.fishDistance = clamp(fish_state.fishDistance,0,1);
  fish_state.fishStamina = clamp(fish_state.fishStamina,0,1);

  const greenLo = 0.35, greenHi = 0.7;
  const dangerHi = 0.92, dangerLo = 0.06;
  if(fish_state.tension>dangerHi){ fish_state.danger += dt; } else { fish_state.danger = Math.max(0,fish_state.danger-dt*1.5); }
  if(fish_state.tension<dangerLo){ fish_state.lowTimer += dt; } else { fish_state.lowTimer = Math.max(0,fish_state.lowTimer-dt*1.5); }
  fish_state.lineDurability -= (fish_state.danger>0? dt*0.5*(1-rod.durability/130):0);

  // rod bend/shake visual
  const bend = clamp((fish_state.tension-0.3)*1.2,0,0.9);
  rodShaft.rotation.z = Math.PI/2*0.86 - bend*0.35 + Math.sin(t*18)*0.02*bend;
  rodGroup.position.y = -0.32 + Math.sin(t*20)*0.01*bend;

  // update line to bobber position pulled toward boat as distance shrinks
  const bowWorld = boat.localToWorld(boat.userData.bowWorldOffset.clone());
  const dir = new THREE.Vector3(Math.cos(-boatPhys.heading), 0, Math.sin(-boatPhys.heading));
  const farPoint = bowWorld.clone().addScaledVector(dir, 2+fish_state.fishDistance*9);
  farPoint.y = waveHeight(farPoint.x,farPoint.z,t)+0.05;
  bobber.position.lerp(farPoint, 0.15);
  bobber.position.x += Math.sin(t*3+fish_state.species.speed)*0.05;
  updateFishingLineGeom();

  // update UI
  el("tensionFill").style.width = (fish_state.tension*100)+"%";
  el("tensionNeedle").style.left = (fish_state.tension*100)+"%";
  el("lineDurFill").style.width = (fish_state.lineDurability*100)+"%";
  el("lineDurFill").style.background = fish_state.lineDurability<0.3? "var(--red)":"var(--line)";

  if(fish_state.lineDurability<=0){
    failFishing("魚線斷了……");
  } else if(fish_state.danger>1.1){
    failFishing("魚線斷了！張力過高");
  } else if(fish_state.lowTimer>2.2){
    failFishing("魚逃走了……張力過低");
  } else if(fish_state.fishDistance<=0 && fish_state.fishStamina<=0.55){
    succeedFishing();
  } else if(fish_state.fishDistance<=0){
    // close enough but not tired -> keep reeling, fish bursts away
    fish_state.fishDistance = 0.25;
    fish_state.tension = clamp(fish_state.tension+0.15,0,1);
  }
}
function updateFishingLineGeom(){
  const tipWorld = new THREE.Vector3();
  rodShaft.getWorldPosition(tipWorld);
  const pts = [tipWorld, bobber.position.clone()];
  fishingLine.geometry.setFromPoints(pts);
}

/* ---------------------------- Day/Night + Weather ----------------------------- */
function updateEnvironment(dt){
  state.time += state.timeSpeed*dt*60/60;
  if(state.time>=24) state.time -= 24;

  state.weatherTimer -= dt;
  if(state.weatherTimer<=0){
    state.weatherTimer = rand(45,90);
    const roll = Math.random();
    state.weather = roll<0.55?"sunny": roll<0.75?"cloudy": roll<0.92?"rain":"storm";
  }

  const angle = (state.time/24)*Math.PI*2 - Math.PI/2;
  const sunHeight = Math.sin(angle);
  const sunDist = 400;
  sun.position.set(Math.cos(angle)*sunDist, Math.max(sunHeight,-0.15)*sunDist*0.6+40, 120);
  sun.target.position.set(0,0,0);
  sunDisc.position.copy(sun.position);
  sunDisc.lookAt(camera.position);

  const dayFactor = clamp(sunHeight*1.3+0.25,0,1);
  const isStormy = state.weather==="storm";
  const isRainy = state.weather==="rain" || isStormy;
  const cloudFactor = state.weather==="cloudy"?0.6: isStormy?0.9: isRainy?0.75:0.15;

  const topDay = new THREE.Color(0x3d7fc9), topNight=new THREE.Color(0x040a18);
  const botDay = new THREE.Color(0xd8ecff), botNight=new THREE.Color(0x14243a);
  const topSunset = new THREE.Color(0xd9784a), botSunset = new THREE.Color(0xffd39a);
  let top = new THREE.Color().lerpColors(topNight, topDay, dayFactor);
  let bot = new THREE.Color().lerpColors(botNight, botDay, dayFactor);
  const sunsetMix = clamp(1-Math.abs(sunHeight)*3,0,1);
  top.lerp(topSunset, sunsetMix*0.6);
  bot.lerp(botSunset, sunsetMix*0.6);
  top.lerp(new THREE.Color(0x394650), cloudFactor*0.5);
  bot.lerp(new THREE.Color(0x5a6672), cloudFactor*0.5);
  skyMat.uniforms.topColor.value.copy(top);
  skyMat.uniforms.bottomColor.value.copy(bot);
  scene.fog.color.copy(bot);
  scene.fog.density = 0.0028 + cloudFactor*0.0025 + (isStormy?0.003:0);

  hemi.intensity = 0.35+dayFactor*0.6;
  sun.intensity = (0.3+dayFactor*1.0) * (1-cloudFactor*0.5);
  const sunCol = new THREE.Color().lerpColors(new THREE.Color(0xffb463), new THREE.Color(0xfff6e0), dayFactor);
  sun.color.copy(sunCol);
  oceanMat.uniforms.uSunColor.value.copy(sunCol);
  oceanMat.uniforms.uSunDir.value.copy(sun.position).normalize();
  oceanMat.uniforms.uRain.value = isRainy?1:0;

  cloudGroup.visible = true;
  cloudGroup.children.forEach(c=>c.material.opacity = 0.4+cloudFactor*0.5);

  rainMat.opacity = isRainy? 0.55:0;
  boat.userData.lantern.material.emissiveIntensity = dayFactor<0.35? 1.0:0.15;
}
function updateRain(dt){
  if(rainMat.opacity<=0) return;
  const pos = rainGeo.attributes.position.array;
  for(let i=0;i<rainCount;i++){
    pos[i*3+1] -= dt*22;
    if(pos[i*3+1]<0){ pos[i*3+1]=40; pos[i*3]=rand(-40,40)+boat.position.x; pos[i*3+2]=rand(-40,40)+boat.position.z; }
  }
  rain.position.set(0,0,0);
  rainGeo.attributes.position.needsUpdate=true;
  rain.position.copy(boat.position);
}

  for(const s of shoals){

  const portD = new THREE.Vector2(boat.position.x-PORT_POS.x, boat.position.z-PORT_POS.z).length();

  if(nearShoal && bestD<9){

  if(state.bucket.length===0){

      html += `<div class="itemCard"><div class="info"><div class="name">${f.name} ${"★".repeat(f.rarity)}</div><div class="desc">${f.weight.toFixed(1)} kg</div></div><button data-idx="${i}" class="sellOneBtn">$${f.price}</button></div>`;
    });
    market.innerHTML = html;
    market.querySelector("#sellAllBtn").onclick = ()=>{
      let sum=0; state.bucket.forEach(f=>sum+=f.price);
      state.money += sum; state.moneyEarned = (state.moneyEarned||0)+sum;

      toast("已出售全部魚獲 +$"+sum);

    market.querySelectorAll(".sellOneBtn").forEach(btn=>{
      btn.onclick = ()=>{
        const idx = Number(btn.dataset.idx);

        state.bucket.splice(idx,1);

        renderPort(); updateHudTop();
      };
    });
  }

  // rod shop
  const rodTab = el("tab-rod");
  rodTab.innerHTML = RODS.map((r,i)=>{
    const owned = i<=state.rod;
    const canBuy = i===state.rod+1 && state.money>=r.price;
    return `<div class="itemCard ${owned?'owned':''}"><div class="info"><div class="name">${r.name}</div>
      <div class="desc">力量${r.power} · 控制${r.control} · 耐久${r.durability}</div></div>
      ${owned? `<button disabled>使用中</button>` : `<button data-i="${i}" class="buyRodBtn" ${canBuy?'':'disabled'}>$${r.price}</button>`}
      </div>`;
  }).join("");
  rodTab.querySelectorAll(".buyRodBtn").forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.i);
      if(i===state.rod+1 && state.money>=RODS[i].price){
        state.money -= RODS[i].price; state.rod=i;
        toast("已購買 "+RODS[i].name);
        renderPort(); updateHudTop();
      }
    };
  });

  // boat shop
  const boatTab = el("tab-boatshop");
  let bhtml = BOATS.map((b,i)=>{
    const owned = i<=state.boatTier;
    const canBuy = i===state.boatTier+1 && state.money>=b.price;
    return `<div class="itemCard ${owned?'owned':''}"><div class="info"><div class="name">${b.name}</div>
      <div class="desc">速度x${b.speed} · 操控x${b.handling} · 魚桶${b.cap}</div></div>
      ${owned? `<button disabled>使用中</button>` : `<button data-i="${i}" class="buyBoatBtn" ${canBuy?'':'disabled'}>$${b.price}</button>`}
      </div>`;
  }).join("");
  bhtml += `<div style="margin:16px 0 8px;color:#8fa9cc;font-size:.8rem;">魚桶升級</div>`;
  const nextCapIdx = BUCKET_UPGRADES.indexOf(state.bucketCap);
  BUCKET_UPGRADES.forEach((cap,i)=>{
    const owned = cap<=state.bucketCap;
    const price = 200*(i+1)*(i+1);
    const canBuy = i===nextCapIdx+1 && state.money>=price;
    bhtml += `<div class="itemCard ${owned?'owned':''}"><div class="info"><div class="name">魚桶容量 ${cap}</div></div>
      ${owned?`<button disabled>已擁有</button>`:`<button data-cap="${cap}" data-price="${price}" class="buyCapBtn" ${canBuy?'':'disabled'}>$${price}</button>`}</div>`;
  });
  boatTab.innerHTML = bhtml;
  boatTab.querySelectorAll(".buyBoatBtn").forEach(btn=>{
    btn.onclick=()=>{
      const i=Number(btn.dataset.i);
      if(i===state.boatTier+1 && state.money>=BOATS[i].price){
        state.money -= BOATS[i].price; state.boatTier=i;
        scene.remove(boat);
        boat = buildBoat(state.boatTier);
        boat.position.copy(boatPhys.pos);
        boat.add(player); player.position.copy(boat.userData.seatWorldOffset); player.rotation.y=Math.PI/2;
        scene.add(boat);
        toast("已升級船隻："+BOATS[i].name);
        renderPort(); updateHudTop();
      }
    };
  });
  boatTab.querySelectorAll(".buyCapBtn").forEach(btn=>{
    btn.onclick=()=>{
      const cap=Number(btn.dataset.cap), price=Number(btn.dataset.price);
      if(state.money>=price){
        state.money-=price; state.bucketCap=cap;
        toast("魚桶容量提升至 "+cap);
        renderPort(); updateHudTop();
      }
    };
  });

  // missions
  const mTab = el("tab-mission");
  if(!state.missions.length) initMissions();
  mTab.innerHTML = state.missions.map(m=>{
    let prog = m.progressKey==="moneyEarned" ? (state.moneyEarned||0) : state.stats[m.progressKey]||0;
    prog = Math.min(prog, m.target);
    const done = prog>=m.target;
    return `<div class="itemCard missionCard"><div class="info"><div class="name">${m.desc}</div>
      <div class="desc">進度：${prog}/${m.target} · 獎勵 $${m.reward}</div></div>
      ${m.claimed? `<button disabled>已領取</button>` : done? `<button data-id="${m.id}" class="claimBtn">領取</button>` : `<button disabled>進行中</button>`}
      </div>`;
  }).join("");
  mTab.querySelectorAll(".claimBtn").forEach(btn=>{
    btn.onclick=()=>{
      const m = state.missions.find(x=>x.id===btn.dataset.id);
      if(m && !m.claimed){
        m.claimed=true; state.money+=m.reward;
        toast("任務完成！+$"+m.reward);
        renderPort(); updateHudTop();
      }
    };
  });
}

/* ---------------------------- Save / Load --------------------------------------- */
function saveGame(){
  const data = {
    money:state.money, bucket:state.bucket, bucketCap:state.bucketCap,
    rod:state.rod, boatTier:state.boatTier, missions:state.missions, stats:state.stats,
    moneyEarned: state.moneyEarned||0,
    boatPos:{x:boatPhys.pos.x,z:boatPhys.pos.z}, heading:boatPhys.heading,
  };
  localStorage.setItem("driftAngler_save", JSON.stringify(data));
}
function loadGame(){
  const raw = localStorage.getItem("driftAngler_save");
  if(!raw) { initMissions(); return; }
  try{
    const d = JSON.parse(raw);
    state.money=d.money??300; state.bucket=d.bucket??[]; state.bucketCap=d.bucketCap??10;
    state.rod=d.rod??0; state.boatTier=d.boatTier??0;
    state.missions=d.missions??[]; state.stats=d.stats??{totalCaught:0,totalRareCaught:0};
    state.moneyEarned=d.moneyEarned??0;
    if(!state.missions.length) initMissions();
    if(d.boatPos){ boatPhys.pos.set(d.boatPos.x,0,d.boatPos.z); boatPhys.heading=d.heading||0; }
    if(state.boatTier>0){
      scene.remove(boat);
      boat = buildBoat(state.boatTier);
      boat.add(player); player.position.copy(boat.userData.seatWorldOffset); player.rotation.y=Math.PI/2;
      scene.add(boat);
    }
  }catch(e){ initMissions(); }
}
loadGame();

/* ---------------------------- Button bindings ----------------------------------- */
el("castBtn").addEventListener("click", startCast);
el("stopFishBtn").addEventListener("click", stopFishingCast);
el("endFishBtn").addEventListener("click", ()=>{ if(fish_state.phase==="reeling"){ toast("搏鬥中無法結束釣魚"); return;} exitFishingMode(); });

/* ---------------------------- Intro sequence ------------------------------------- */
function playIntro(){
  setTimeout(()=>document.getElementById("l1").classList.add("show"), 600);
  setTimeout(()=>document.getElementById("l2").classList.add("show"), 2600);
  setTimeout(()=>document.getElementById("startBtn").classList.add("show"), 4200);
}
playIntro();
document.getElementById("startBtn").addEventListener("click", ()=>{
  const intro = document.getElementById("intro");
  intro.style.opacity="0";
  setTimeout(()=>{ intro.style.display="none"; }, 1500);
  document.getElementById("hud").style.display="block";
  state.mode="thirdperson";
  checkOrientation();
});
function checkOrientation(){
  const hint = document.getElementById("rotateHint");
  const isTouch = "ontouchstart" in window;
  const portrait = window.innerHeight > window.innerWidth;
  hint.style.display = (isTouch && portrait) ? "flex" : "none";
}
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  checkOrientation();
});

/* ---------------------------- Main loop ------------------------------------------ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  oceanMat.uniforms.uTime.value = t;
  updateEnvironment(dt);
  updateRain(dt);
  splashPool.update(dt);

  for(const s of shoals) s.update(dt,t, boat.position);
  for(const b of birds){
    const ang = t*0.3+b.userData.phase;
    b.position.x = b.userData.center.x + Math.cos(ang)*b.userData.radius;
    b.position.z = b.userData.center.y + Math.sin(ang)*b.userData.radius;
    b.position.y = 40+Math.sin(t*2+b.userData.phase)*4;
    b.lookAt(b.position.x+Math.cos(ang+0.1), b.position.y, b.position.z+Math.sin(ang+0.1));
    b.children[0].rotation.z = 0.5+Math.sin(t*10+b.userData.phase)*0.4;
    b.children[1].rotation.z = -0.5-Math.sin(t*10+b.userData.phase)*0.4;
  }

  if(state.mode==="thirdperson"){
    updateBoat(dt,t);
    updateThirdPersonCamera(dt);
    updateProximity();
    fpRig.visible=false;
  } else if(state.mode==="transitioning"){
    fish_state.transT += dt/1.1;
    const tt = Math.min(fish_state.transT,1);
    const ease = tt*tt*(3-2*tt);
    updateThirdPersonCameraBlendToFP(ease, dt, t);
    if(tt>=1){
      state.mode="fishing"; fish_state.phase="ready";
      fpRig.visible=true;
    }
  } else if(state.mode==="fishing"){
    updateFirstPersonCamera(dt);
    fpRig.visible=true;
    if(rodGroup.userData.castAnim!==undefined && fish_state.phase==="casting"){
      rodGroup.userData.castAnim += dt*4;
      rodGroup.rotation.x = -0.1 - Math.sin(Math.min(rodGroup.userData.castAnim,1)*Math.PI)*0.9;
    } else {
      rodGroup.rotation.x = lerp(rodGroup.rotation.x, -0.1, dt*6);
    }
    if(fish_state.phase==="waiting"){
      fish_state.biteTimer -= dt;
      bobber.position.y = waveHeight(bobber.position.x,bobber.position.z,t)+0.06+Math.sin(t*2)*0.02;
      updateFishingLineGeom();
      if(fish_state.biteTimer<=0) triggerBite();
    } else if(fish_state.phase==="reeling"){
      updateMinigame(dt,t);
    }
  } else if(state.mode==="exiting"){
    fish_state.transT += dt/0.9;
    const tt = Math.min(fish_state.transT,1);
    const ease = tt*tt*(3-2*tt);
    updateThirdPersonCameraBlendToFP(1-ease, dt, t);
    if(tt>=1){ state.mode="thirdperson"; fpRig.visible=false; boat.position.y = waveHeight(boat.position.x,boat.position.z,t); }
  } else if(state.mode==="port"){
    // idle bobbing camera at port, boat stays
  }

  updateHudTop();
  renderer.render(scene, camera);
}
function updateThirdPersonCameraBlendToFP(blend, dt, t){
  // blend camera between third-person orbit position and first-person bow position
  updateBoat(0,t); // keep wave bobbing consistent even if speed=0
  const bowWorld = boat.localToWorld(boat.userData.bowWorldOffset.clone());
  const fpPos = new THREE.Vector3(bowWorld.x, bowWorld.y+0.35, bowWorld.z);
  const dist=8.5, height=4.2;
  const yaw = -boatPhys.heading + Math.PI/2;
  const tpPos = new THREE.Vector3(
    boat.position.x - Math.cos(yaw)*dist,
    boat.position.y + height,
    boat.position.z - Math.sin(yaw)*dist
  );
  camera.position.lerpVectors(tpPos, fpPos, blend);
  const tpLook = boat.position.clone().add(new THREE.Vector3(0,1.4,0));
  const baseYaw = -boatPhys.heading;
  const fpLookDir = new THREE.Vector3(Math.cos(baseYaw), -0.05, Math.sin(baseYaw));
  const fpLook = camera.position.clone().add(fpLookDir);
  const blendedLook = tpLook.clone().lerp(fpLook, blend);
  camera.lookAt(blendedLook);
  fpRig.visible = blend>0.5;
}
animate();

/* Autosave every 30s */
setInterval(()=>{ if(state.mode!=="intro") saveGame(); }, 30000);
window.addEventListener("beforeunload", ()=>{ if(state.mode!=="intro") saveGame(); });

</script>
