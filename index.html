<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>釣魚世界 🎣 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep-navy:#0a1826;
  --water-teal:#0e5266;
  --water-teal-2:#12768f;
  --moss:#2f5233;
  --moss-2:#3d6b40;
  --amber:#e8a33d;
  --amber-bright:#ffc766;
  --gold:#ffd76a;
  --panel:#0f2536ee;
  --panel-light:#173650;
  --line:#2a5570;
  --text-main:#eef4f6;
  --text-dim:#9db3c0;
  --perfect:#38e08a;
  --great:#f5d95a;
  --good:#6cb8ff;
  --miss:#ff6262;
  --thunder:#f7e34d;
  --danger:#ff5c5c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  background:var(--deep-navy);
  font-family:'Noto Sans TC', sans-serif;
  color:var(--text-main);
  touch-action:none;
}
.pixel{font-family:'Press Start 2P', monospace;}
#app{position:fixed; inset:0; width:100%; height:100%; overflow:hidden;}
.screen{position:absolute; inset:0; display:none; flex-direction:column;}
.screen.active{display:flex;}
canvas{display:block; image-rendering:pixelated;}

/* ---------- Intro ---------- */
#screen-intro{
  align-items:center; justify-content:center; text-align:center;
  background:
    radial-gradient(ellipse at 50% 20%, #163a52 0%, transparent 60%),
    linear-gradient(180deg, #081420 0%, #051019 60%, #030a10 100%);
  padding:24px;
}
.intro-wave{position:absolute; bottom:0; left:0; width:100%; height:140px; opacity:.5; pointer-events:none;}
.intro-title{
  font-size:15px; line-height:2.1; letter-spacing:1px; color:var(--gold);
  text-shadow:0 0 18px rgba(255,215,106,.5), 0 2px 0 #000;
  margin-bottom:28px;
  animation:fadeIn 1.2s ease;
}
.intro-sub{
  font-size:14px; line-height:2; color:var(--text-dim); max-width:340px; margin-bottom:26px;
  animation:fadeIn 1.6s ease;
  white-space:pre-line;
}
.intro-final{font-size:14px; color:#fff; margin-bottom:34px; animation:fadeIn 2.2s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.btn{
  font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:15px;
  border:none; border-radius:10px; padding:14px 26px; cursor:pointer;
  background:linear-gradient(180deg, var(--amber-bright), var(--amber));
  color:#2b1a02; box-shadow:0 4px 0 #8a5a10, 0 6px 14px rgba(0,0,0,.4);
  transition:transform .08s;
  letter-spacing:1px;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a5a10;}
.btn.secondary{background:linear-gradient(180deg,#3a6b86,#245066); color:#eaf6ff; box-shadow:0 4px 0 #123141, 0 6px 14px rgba(0,0,0,.4);}
.btn.danger{background:linear-gradient(180deg,#ff7d7d,#e14b4b); color:#3a0000; box-shadow:0 4px 0 #8f1414;}
.btn:disabled{opacity:.4; filter:grayscale(.4);}

#name-form{display:flex; flex-direction:column; align-items:center; gap:18px; animation:fadeIn 1.4s ease;}
#name-input{
  font-family:'Noto Sans TC', sans-serif; font-size:16px; padding:12px 16px; border-radius:10px;
  border:2px solid var(--amber); background:#0c2334; color:#fff; text-align:center; width:220px;
}
#name-input:focus{outline:none; box-shadow:0 0 0 3px rgba(232,163,61,.4);}
.name-label{font-size:14px; color:var(--text-dim);}

/* ---------- World / third person ---------- */
#screen-world{background:#000;}
#world-canvas{position:absolute; inset:0; width:100%; height:100%;}
.hud-top{
  position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
  padding:10px 12px; pointer-events:none; z-index:5;
}
.hud-pill{
  background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 12px;
  font-size:12px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(2px);
  box-shadow:0 3px 8px rgba(0,0,0,.35);
}
.hud-pill b{color:var(--gold);}
#codex-btn{pointer-events:auto; cursor:pointer;}

.prompt-fish{
  position:absolute; left:50%; top:32%; transform:translate(-50%,0); z-index:6;
  display:none; flex-direction:column; align-items:center; gap:10px;
  animation:bob 1.6s ease-in-out infinite;
}
.prompt-fish.show{display:flex;}
@keyframes bob{0%,100%{transform:translate(-50%,0);} 50%{transform:translate(-50%,-8px);}}
.prompt-badge{
  background:var(--panel); border:1px solid var(--amber); border-radius:12px; padding:8px 14px;
  font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.5);
}

.joystick-zone{position:absolute; left:0; bottom:0; width:46%; height:52%; z-index:7;}
.joystick-base{
  position:absolute; width:104px; height:104px; border-radius:50%;
  background:rgba(20,50,70,.45); border:2px solid rgba(232,163,61,.5); display:none;
}
.joystick-knob{
  position:absolute; width:46px; height:46px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--amber-bright), var(--amber));
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}
.action-zone{position:absolute; right:14px; bottom:20px; z-index:7; display:flex; flex-direction:column; gap:12px; align-items:flex-end;}
.round-btn{
  width:74px; height:74px; border-radius:50%; border:none;
  background:radial-gradient(circle at 35% 30%, var(--amber-bright), var(--amber));
  color:#2b1a02; font-weight:700; font-size:12px; box-shadow:0 5px 0 #8a5a10, 0 7px 16px rgba(0,0,0,.4);
  display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2;
}
.round-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #8a5a10;}
.round-btn.small{width:58px; height:58px; font-size:22px;}

/* ---------- Fishing first person ---------- */
#screen-fishing{background:#01141f;}
#fish-canvas{position:absolute; inset:0; width:100%; height:100%;}
.fp-hands{position:absolute; left:0; right:0; bottom:0; height:46%; pointer-events:none; z-index:4;}
.fishing-hud-tl{position:absolute; top:12px; left:12px; z-index:6;}
.fishing-hud-tr{position:absolute; top:12px; right:12px; z-index:6; text-align:right; display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
.fishing-hud-bl{position:absolute; bottom:16px; left:12px; z-index:6;}
.fishing-hud-br{position:absolute; bottom:16px; right:14px; z-index:6;}
.bite-mark{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0);
  font-size:64px; color:var(--danger); text-shadow:0 0 20px rgba(255,0,0,.7); z-index:8;
  font-family:'Press Start 2P';
}
.bite-mark.show{animation:pop .5s ease forwards;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0); opacity:0;} 40%{transform:translate(-50%,-50%) scale(1.3); opacity:1;} 100%{transform:translate(-50%,-50%) scale(1); opacity:1;}}
.hint-text{
  position:absolute; left:50%; bottom:34%; transform:translate(-50%,0); z-index:6;
  font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 14px;
  display:none;
}
.hint-text.show{display:block; animation:fadeIn .3s ease;}

/* ---------- Calibration ---------- */
#calib-overlay{
  position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column;
  background:rgba(2,10,16,.55);
}
#calib-overlay.show{display:flex;}
.calib-title{font-size:13px; color:var(--gold); margin-bottom:18px; letter-spacing:1px;}
.calib-track{
  position:relative; width:88%; max-width:420px; height:34px; border-radius:17px;
  background:#0c2233; border:2px solid var(--line); overflow:hidden; box-shadow:inset 0 3px 8px rgba(0,0,0,.5);
}
.calib-zone{position:absolute; top:0; bottom:0; background:rgba(56,224,138,.35); border-left:2px solid var(--perfect); border-right:2px solid var(--perfect);}
.calib-zone-inner{position:absolute; top:0; bottom:0; background:rgba(56,224,138,.75);}
.calib-indicator{
  position:absolute; top:-6px; width:8px; height:46px; border-radius:4px;
  background:linear-gradient(180deg,#fff,#ffd76a); box-shadow:0 0 10px rgba(255,215,106,.8);
}
.calib-result{
  margin-top:20px; font-size:22px; font-family:'Press Start 2P'; opacity:0; transform:scale(.6);
}
.calib-result.show{animation:resultPop .6s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes resultPop{to{opacity:1; transform:scale(1);}}
.calib-buffs{margin-top:10px; font-size:12px; color:var(--text-dim); text-align:center; min-height:18px;}
#calib-tap{margin-top:26px;}

/* ---------- Battle ---------- */
#screen-battle{background:linear-gradient(180deg,#03141f,#02090f);}
.battle-top{padding:12px 14px 0; display:flex; justify-content:space-between; align-items:flex-start;}
.fish-card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; min-width:150px;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
}
.fish-name{font-size:14px; font-weight:700; color:var(--gold); display:flex; align-items:center; gap:6px;}
.bar-wrap{margin-top:6px;}
.bar-label{font-size:10px; color:var(--text-dim); display:flex; justify-content:space-between;}
.bar-bg{height:10px; border-radius:6px; background:#0c2233; overflow:hidden; margin-top:2px; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:6px; transition:width .35s ease;}
.bar-fill.capture{background:linear-gradient(90deg,#ff8a5c,#ff5c5c);}
.bar-fill.struggle{background:linear-gradient(90deg,#ffd76a,#e8a33d);}
.fish-weak{font-size:11px; margin-top:6px; color:var(--thunder);}
.fish-sprite{width:64px; height:64px; margin:0 auto;}

.player-status{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; text-align:right;}
.energy-row{display:flex; gap:5px; justify-content:flex-end; margin-top:4px;}
.energy-dot{width:14px; height:14px; border-radius:4px; background:#1a3a4d; border:1px solid var(--line);}
.energy-dot.on{background:var(--amber-bright); box-shadow:0 0 6px rgba(255,199,102,.8);}
.buff-tags{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; margin-top:6px;}
.buff-tag{font-size:10px; padding:2px 6px; border-radius:8px; background:rgba(56,224,138,.18); color:var(--perfect); border:1px solid rgba(56,224,138,.4);}

.battle-log{
  margin:8px 14px 0; font-size:11px; color:var(--text-dim); min-height:16px; text-align:center;
}
.battle-mid{flex:1; position:relative; display:flex; align-items:center; justify-content:center;}
#battle-fx-canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}

.hand-wrap{padding:10px 10px 14px; display:flex; flex-direction:column; gap:10px;}
.hand-row{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none;}
.hand-row::-webkit-scrollbar{display:none;}
.card{
  min-width:104px; max-width:104px; height:140px; border-radius:12px; padding:8px;
  display:flex; flex-direction:column; justify-content:space-between; flex-shrink:0;
  border:2px solid var(--line); box-shadow:0 4px 10px rgba(0,0,0,.4); transition:transform .12s, box-shadow .12s;
  background:linear-gradient(160deg, #16324a, #0d2131);
}
.card.attack{border-color:#e05c5c;}
.card.defense{border-color:#4fa0e0;}
.card.skill{border-color:#c76ce0;}
.card.support{border-color:#6ee08d;}
.card.selected{transform:translateY(-10px); box-shadow:0 0 14px rgba(255,215,106,.7);}
.card.disabled{opacity:.35;}
.card-type{font-size:9px; color:var(--text-dim); display:flex; justify-content:space-between;}
.card-icon{font-size:22px; text-align:center;}
.card-name{font-size:11px; font-weight:700; text-align:center; line-height:1.3;}
.card-desc{font-size:9px; color:var(--text-dim); text-align:center; line-height:1.25;}
.battle-actions{display:flex; gap:10px; justify-content:center;}

/* ---------- Result / codex ---------- */
#screen-result{align-items:center; justify-content:center; background:radial-gradient(circle at 50% 30%, #163a52, #030a10 70%);}
.result-card{
  background:var(--panel); border:2px solid var(--amber); border-radius:18px; padding:28px 26px; text-align:center;
  width:86%; max-width:340px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:resultPop .5s cubic-bezier(.2,1.4,.4,1);
}
.result-title{font-size:13px; color:var(--gold); margin-bottom:10px; letter-spacing:1px;}
.result-fish{font-size:20px; font-weight:900; margin:10px 0 4px;}
.result-stars{color:var(--thunder); font-size:15px; margin-bottom:14px;}
.result-stats{font-size:12px; color:var(--text-dim); line-height:1.9; text-align:left; padding:0 8px;}
.result-stats b{color:#fff;}

#screen-codex{background:var(--deep-navy); align-items:stretch;}
.codex-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line);}
.codex-list{flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.codex-item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
.codex-item .name{font-size:12px; font-weight:700; margin-top:4px;}
.codex-item .meta{font-size:10px; color:var(--text-dim); margin-top:4px;}
.codex-item.locked{opacity:.35;}

/* toast */
#toast{
  position:absolute; left:50%; top:14%; transform:translate(-50%,-20px); z-index:50;
  background:var(--panel); border:1px solid var(--amber); border-radius:10px; padding:10px 18px;
  font-size:12px; opacity:0; transition:all .3s ease; pointer-events:none;
}
#toast.show{opacity:1; transform:translate(-50%,0);}

/* screen shake */
.shake{animation:shakeAnim .4s ease;}
@keyframes shakeAnim{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-6px,3px);}
  40%{transform:translate(6px,-4px);}
  60%{transform:translate(-5px,-2px);}
  80%{transform:translate(4px,3px);}
}
::selection{background:transparent;}
</style>
</head>
<body>
<div id="app">

  <!-- 開場 -->
  <div class="screen active" id="screen-intro">
    <canvas id="intro-canvas" class="intro-wave"></canvas>
    <div id="intro-step-1">
      <div class="intro-title pixel">🎣 歡迎來到<br>釣魚世界 🌍</div>
      <button class="btn" onclick="Game.introNext()">開始</button>
    </div>
    <div id="intro-step-2" style="display:none;">
      <div class="intro-sub">一片未知的海洋
無數等待被發現的魚類
還有傳說中從未有人捕獲過的神秘生物……</div>
      <div class="intro-final">你的故事，將從這裡開始。</div>
      <button class="btn" onclick="Game.introNext()">繼續</button>
    </div>
    <div id="intro-step-3" style="display:none;">
      <div class="name-label" style="margin-bottom:14px;">請問你的名字是？</div>
      <div id="name-form">
        <input id="name-input" maxlength="8" placeholder="輸入角色名稱">
        <button class="btn" onclick="Game.confirmName()">確認並開始冒險</button>
      </div>
    </div>
  </div>

  <!-- 第三人稱世界 -->
  <div class="screen" id="screen-world">
    <canvas id="world-canvas"></canvas>
    <div class="hud-top">
      <div class="hud-pill" id="codex-btn" onclick="Game.openCodex()">📖 圖鑑 <b id="hud-codex-count">0/2</b></div>
      <div class="hud-pill">🧑 <b id="hud-player-name">?</b> · Lv.<b id="hud-level">1</b></div>
    </div>
    <div class="prompt-fish" id="fish-prompt">
      <div class="prompt-badge">🎣 可以在這裡釣魚</div>
      <button class="btn" onclick="Game.startFishing()">開始釣魚</button>
    </div>
    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base" id="joystick-base"><div class="joystick-knob" id="joystick-knob"></div></div>
    </div>
    <div class="action-zone">
      <button class="round-btn small" id="btn-interact" style="display:none;" onclick="Game.startFishing()">互動</button>
    </div>
  </div>

  <!-- 第一人稱釣魚 -->
  <div class="screen" id="screen-fishing">
    <canvas id="fish-canvas"></canvas>
    <canvas id="fp-hands-canvas" class="fp-hands"></canvas>

    <div class="fishing-hud-tl">
      <div class="hud-pill">🌲 迷霧森林湖泊</div>
    </div>
    <div class="fishing-hud-tr">
      <div class="hud-pill" id="hud-time">14:32</div>
      <div class="hud-pill" id="hud-weather">☀ 晴天</div>
    </div>
    <div class="fishing-hud-bl">
      <div class="hud-pill">🎣 初級釣竿 Lv.1</div>
    </div>
    <div class="fishing-hud-br">
      <button class="btn danger" onclick="Game.endFishing()">結束釣魚</button>
    </div>

    <div class="bite-mark" id="bite-mark">！</div>
    <div class="hint-text" id="hint-text">快點！在魚跑掉之前拉竿！</div>

    <div class="action-zone" id="fishing-action-zone">
      <button class="round-btn" id="btn-cast" onclick="Game.castLine()">拋竿</button>
    </div>
  </div>

  <!-- 校準 -->
  <div id="calib-overlay">
    <div class="calib-title pixel">🎯 釣魚校準</div>
    <div class="calib-track" id="calib-track">
      <div class="calib-zone" id="calib-zone"><div class="calib-zone-inner" id="calib-zone-inner"></div></div>
      <div class="calib-indicator" id="calib-indicator"></div>
    </div>
    <div class="calib-buffs" id="calib-buffs-preview"></div>
    <button class="round-btn" id="calib-tap" onclick="Calibration.tap()">校準</button>
    <div class="calib-result pixel" id="calib-result"></div>
  </div>

  <!-- 卡牌戰鬥 -->
  <div class="screen" id="screen-battle">
    <div class="battle-top">
      <div class="fish-card">
        <div class="fish-name" id="battle-fish-name">🐟 ???</div>
        <div class="fish-weak" id="battle-fish-weak"></div>
        <div class="bar-wrap">
          <div class="bar-label"><span>捕獲值</span><span id="battle-capture-num">100/100</span></div>
          <div class="bar-bg"><div class="bar-fill capture" id="battle-capture-bar" style="width:100%"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label"><span>魚反抗力</span><span id="battle-struggle-num">10</span></div>
          <div class="bar-bg"><div class="bar-fill struggle" id="battle-struggle-bar" style="width:20%"></div></div>
        </div>
      </div>
      <div class="player-status">
        <div style="font-size:12px; color:var(--text-dim);">回合 <b id="battle-turn" style="color:#fff;">1</b>/<span id="battle-turn-max">6</span></div>
        <div class="energy-row" id="battle-energy"></div>
        <div class="buff-tags" id="battle-buffs"></div>
      </div>
    </div>
    <div class="battle-log" id="battle-log">校準完成，戰鬥開始！</div>
    <div class="battle-mid">
      <canvas id="battle-fx-canvas"></canvas>
      <div class="fish-sprite" id="battle-fish-sprite" style="font-size:56px; text-align:center;">🐟</div>
    </div>
    <div class="hand-wrap">
      <div class="hand-row" id="hand-row"></div>
      <div class="battle-actions">
        <button class="btn secondary" onclick="Battle.endTurn()">結束回合</button>
      </div>
    </div>
  </div>

  <!-- 捕獲結果 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-title pixel">🎣 捕獲成功！</div>
      <div id="result-fish-emoji" style="font-size:52px;">🐟</div>
      <div class="result-fish" id="result-fish-name">???</div>
      <div class="result-stars" id="result-fish-rarity">★★★</div>
      <div class="result-stats" id="result-stats"></div>
      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
        <button class="btn secondary" onclick="Game.openCodex(true)">查看圖鑑</button>
        <button class="btn" onclick="Game.backToFishingFromResult()">繼續釣魚</button>
      </div>
    </div>
  </div>

  <!-- 圖鑑 -->
  <div class="screen" id="screen-codex">
    <div class="codex-header">
      <div class="pixel" style="font-size:13px; color:var(--gold);">📖 魚類圖鑑</div>
      <button class="btn secondary" id="codex-close-btn" onclick="Game.closeCodex()">關閉</button>
    </div>
    <div class="codex-list" id="codex-list"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
